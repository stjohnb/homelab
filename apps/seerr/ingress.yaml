apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
  labels:
    app: seerr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik-traefik
  tls:
    - hosts:
        - seerr.home.bstjohn.net
        - seerr.ext.bstjohn.net
      secretName: wildcard-home-tls
  rules:
    - host: seerr.home.bstjohn.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seerr
                port:
                  number: 5055
    - host: seerr.ext.bstjohn.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seerr
                port:
                  number: 5055
