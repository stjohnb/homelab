---
name: Build arpwatch image

# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
concurrency:
  group: build-arpwatch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

# docker/buildx come from the runner's baseline (nix, git, docker); the only
# tool this workflow shells out to is `gh`, which comes from this repo's
# flake.nix `scripts` devShell via the job-level default shell below.
jobs:
  build:
    runs-on: [self-hosted, linux]
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#scripts --command bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          DATE=$(date -u +'%Y-%m-%d')
          PREFIX="v${DATE}."

          # Fetch all tags for the arpwatch package.
          TAGS=$(gh api --paginate \
            "/orgs/${OWNER}/packages/container/arpwatch/versions" \
            --jq '.[].metadata.container.tags[]')

          MAX=0
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            case "$t" in
              "${PREFIX}"*)
                N="${t#${PREFIX}}"
                if [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -gt "$MAX" ]; then
                  MAX="$N"
                fi
                ;;
            esac
          done <<< "$TAGS"

          BUILD=$((MAX + 1))
          TAG="v${DATE}.${BUILD}"
          echo "Computed tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/arpwatch
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/arpwatch:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner }}/arpwatch:latest
