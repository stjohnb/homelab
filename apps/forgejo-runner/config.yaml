apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  labels:
    app: forgejo-runner
data:
  config.yml: |
    log:
      level: info
      job_level: info

    runner:
      # Connection (url/uuid/token) comes from daemon CLI flags fed by the
      # imperatively-created forgejo-runner-secret. See docs/forgejo-actions.md.
      file: /data/.runner
      capacity: 2
      timeout: 1h
      shutdown_timeout: 10m
      insecure: false
      fetch_timeout: 30s
      fetch_interval: 5s
      report_interval: 1s
      # Forgejo schedules a job here only if EVERY label in the workflow's
      # runs-on list appears below; the first matching label picks the image.
      # All five map to the same image so behaviour never depends on the order
      # of a workflow's runs-on list. The image is built by
      # St-John-Software/forgejo on git.home.bstjohn.net alongside the Forgejo
      # server image (docs/registry.md) — node 22 + git + bash + nix.
      # nix is required because ported perudo workflows run every step through
      # `nix develop`; node is required because act_runner supplies none for JS
      # actions like actions/checkout. The image lives on the LAN registry
      # (docs/registry.md), which is also private, so the runner still
      # authenticates via DOCKER_CONFIG (see deployment.yaml) — only the
      # credential and the host changed. Pin an immutable tag here, never
      # :latest. Bumping it requires a runner pod restart — act_runner reads
      # this file only at daemon start.
      labels:
        - "self-hosted:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "linux:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "docker:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "ubuntu-latest:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "ubuntu-22.04:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"

    cache:
      # Disabled: the cache proxy binds in the pod netns and is not reliably
      # reachable from job containers created by the dind sidecar. No migrated
      # workflow uses actions/cache yet.
      # (The dind bridge gateway is still unreachable from job containers; the
      # docker socket is a filesystem path, not a network route, so #1156 does
      # not unblock the cache.)
      enabled: false

    container:
      network: ""
      # The JOB container stays unprivileged. It can still ask the dind daemon
      # for a privileged container — see the blast-radius note in
      # docs/forgejo-actions.md.
      privileged: false
      options:
      workdir_parent:
      # Left empty on purpose. act_runner appends the docker_host path to the
      # job container's allowed-volume list automatically
      # (act/runner/run_context.go GetBindsAndMounts, v12.13.2), so the socket
      # below needs no entry here and nothing else should be mountable.
      valid_volumes: []
      # A unix:// path is the ONLY shape act_runner v12.13.2 can give a job
      # container: it bind-mounts this path to /var/run/docker.sock inside the
      # job (GetBindsAndMounts). "-" means no docker at all; any tcp:// value is
      # silently rewritten to "-" by configCheck in internal/app/cmd/daemon.go.
      # The path is resolved by the dind daemon in ITS filesystem, which is why
      # /dind-sock must be an emptyDir mounted into BOTH containers, and it also
      # becomes the runner daemon's own DOCKER_HOST — keep it identical to the
      # DOCKER_HOST env in deployment.yaml.
      docker_host: unix:///dind-sock/docker.sock
      force_pull: false
      force_rebuild: false

    host:
      workdir_parent:
