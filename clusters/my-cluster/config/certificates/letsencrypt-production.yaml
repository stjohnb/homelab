apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: brendan@bstjohn.net
    privateKeySecretRef:
      name: letsencrypt-production-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.bstjohn.net
            solverName: godaddy
            config:
              apiKeySecretRef:
                name: godaddy-api-key
                key: key
                secret: secret
              production: true
              ttl: 600
        selector:
          dnsZones:
            - "bstjohn.net"
