apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-gate-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NAS Offline</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
            }
            .container { text-align: center; padding: 2rem; max-width: 420px; }
            .icon { font-size: 4rem; margin-bottom: 1.5rem; }
            h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
            .subtitle { color: #8892b0; margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5; }
            .wake-btn {
                background: #0d6efd;
                color: #fff;
                border: none;
                padding: 0.875rem 2rem;
                font-size: 1rem;
                font-weight: 500;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.2s;
            }
            .wake-btn:hover { background: #0b5ed7; transform: translateY(-1px); }
            .wake-btn:disabled { background: #6c757d; cursor: not-allowed; transform: none; }
            .status { margin-top: 1.5rem; font-size: 0.875rem; color: #8892b0; min-height: 1.5rem; }
            .status.success { color: #20c997; }
            .status.error { color: #dc3545; }
            .spinner {
                display: inline-block;
                width: 1rem;
                height: 1rem;
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 50%;
                border-top-color: #fff;
                animation: spin 1s linear infinite;
                vertical-align: middle;
                margin-right: 0.5rem;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
            .progress {
                margin-top: 1rem;
                height: 4px;
                background: rgba(255,255,255,0.1);
                border-radius: 2px;
                overflow: hidden;
                display: none;
            }
            .progress.active { display: block; }
            .progress-inner {
                height: 100%;
                background: #0d6efd;
                width: 0%;
                transition: width 1s linear;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">💤</div>
            <h1>The NAS is asleep</h1>
            <p class="subtitle">
                Storage server is powered off to save energy.<br>
                Wake it up to access your media and photos.
            </p>
            <button class="wake-btn" id="wakeBtn" onclick="wake()">
                Wake the NAS
            </button>
            <div class="progress" id="progress">
                <div class="progress-inner" id="progressInner"></div>
            </div>
            <p class="status" id="status"></p>
        </div>

        <script>
            // Same-origin proxy; nginx forwards this to the Home Assistant
            // webhook whose URL lives in a SOPS-encrypted Secret.
            const WAKE_ENDPOINT = '/_gate/wake';
            const MAX_WAIT = 90;

            let pollCount = 0;

            async function wake() {
                const btn = document.getElementById('wakeBtn');
                const status = document.getElementById('status');
                const progress = document.getElementById('progress');

                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span>Sending...';
                status.textContent = '';
                status.className = 'status';

                try {
                    const res = await fetch(WAKE_ENDPOINT, { method: 'POST' });
                    if (!res.ok) {
                        throw new Error('wake proxy returned ' + res.status);
                    }

                    btn.innerHTML = '<span class="spinner"></span>Waiting...';
                    status.textContent = 'Wake signal sent. Usually takes 30-60 seconds.';
                    status.className = 'status success';
                    progress.classList.add('active');

                    pollCount = 0;
                    poll();
                } catch (err) {
                    btn.textContent = 'Wake the NAS';
                    btn.disabled = false;
                    status.textContent = 'Failed to send wake signal';
                    status.className = 'status error';
                }
            }

            async function poll() {
                if (pollCount >= MAX_WAIT) {
                    document.getElementById('status').textContent = 'Taking longer than expected. Try refreshing.';
                    document.getElementById('status').className = 'status error';
                    document.getElementById('wakeBtn').textContent = 'Wake the NAS';
                    document.getElementById('wakeBtn').disabled = false;
                    return;
                }

                pollCount++;
                document.getElementById('progressInner').style.width = (pollCount / MAX_WAIT * 100) + '%';

                try {
                    const up = await checkServiceUp();
                    if (up) {
                        document.getElementById('status').textContent = 'Service is back! Redirecting...';
                        document.getElementById('status').className = 'status success';
                        setTimeout(() => location.reload(), 1500);
                        return;
                    }
                } catch (e) {}

                setTimeout(poll, 1000);
            }

            function checkServiceUp() {
                return new Promise((resolve) => {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 3000);

                    fetch(location.origin, { signal: controller.signal })
                        .then(res => { clearTimeout(timeout); resolve(res.ok); })
                        .catch(() => { clearTimeout(timeout); resolve(false); });
                });
            }

            checkServiceUp().then(up => { if (up) location.reload(); });
        </script>
    </body>
    </html>
