apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-restricted
  labels:
    app: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  # Applying this policy makes the postgres pod default-deny on the pod network.
  # An app onboarded later MUST be added to the allow-list below or it will
  # silently fail to connect. The migration runner needs no entry — it reaches
  # this pod through the apiserver's pods/exec endpoint, not the pod network.
  #
  # The peers below match only pods in `default`. Claws agent pods
  # (`claws-workload: agent` in `claws-sessions`, CLAWS_WORK_BACKEND=k8s-pod)
  # are deliberately NOT admitted here, and still must not get a peer: they
  # reach Claws data through the agent-pod ops API on TCP 3000 that
  # claws#3359 shipped (closed claws issue clw_01M386P9KPDEVV33TKY512HHBC),
  # and the pod Secret carries no database credentials, so a 5432 connection
  # attempt from an agent pod would itself be a claws bug, not a policy gap.
  ingress:
    # `forgejo` also covers the forgejo-backup Job pods: they carry the same
    # `app: forgejo` pod label, and after the DB cutover `forgejo dump` reads
    # the database over the pod network.
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [authentik-server, authentik-worker, immich, garden, gatus, forgejo, postgres-exporter, datasette-sync, claws, growth-engine, mealie]
      ports:
        - protocol: TCP
          port: 5432
    # postgres-db-backup and immich-db-backup pods carry no `app` label.
    - from:
        - podSelector:
            matchLabels:
              component: db-backup
      ports:
        - protocol: TCP
          port: 5432
