apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.40.x"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 12h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    config:
      sessionTTL: null
      oidc:
        externalSecret:
          enabled: true
          name: headlamp-oidc
    clusterRoleBinding:
      create: false
    serviceAccount:
      name: headlamp
    ingress:
      enabled: true
      ingressClassName: traefik-traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: dashboard.home.bstjohn.net
          paths:
            - path: /
              type: Prefix
        - host: dashboard.ext.bstjohn.net
          paths:
            - path: /
              type: Prefix
      tls:
        - secretName: wildcard-home-tls
          hosts:
            - dashboard.home.bstjohn.net
            - dashboard.ext.bstjohn.net
