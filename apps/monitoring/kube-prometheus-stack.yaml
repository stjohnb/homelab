                - uid: workload-deployment-replicas-mismatch
                  title: Workload Deployment Replicas Mismatch
                  condition: C
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: >-
                      Deployment {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.deployment {{ "}}" }}
                      has fewer available replicas than desired
                    description: >-
                      The Deployments known to sleep with k3s-nas or ryzen (see
                      workload-pod-pending) are excluded only while that node is
                      not Ready, so a replica shortfall while the node is awake
                      still alerts — a new node-pinned Deployment must be added to
                      the matching per-node regex in all three Workload rules,
                      including workload-rollout-stalled. The
                      `changes(...updated[10m]) == 0` term keeps this quiet during a
                      normal rollout. Both sides are wrapped in `max by
                      (namespace, deployment)` so a kube-state-metrics pod
                      replacement (chart bump, node drain) — which changes the
                      `instance`/`pod` labels these series otherwise carry —
                      doesn't restart the `for: 15m` timer on an ongoing
                      mismatch. Check
                      `kubectl get deployment -n {{ "{{" }} $labels.namespace {{ "}}" }}
                      {{ "{{" }} $labels.deployment {{ "}}" }}` and its pod events.
                  data:
                    - refId: A
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (
