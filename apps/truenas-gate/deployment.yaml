apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-gate
  labels:
    app: truenas-gate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenas-gate
  template:
    metadata:
      labels:
        app: truenas-gate
    spec:
      automountServiceAccountToken: false
      priorityClassName: standard
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginx:1.28.3-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: wake-webhook
              mountPath: /etc/nginx/wake
              readOnly: true
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: truenas-gate-nginx-config
        - name: html
          configMap:
            name: truenas-gate-html
        - name: wake-webhook
          secret:
            secretName: truenas-gate-wake-webhook
            defaultMode: 0444
