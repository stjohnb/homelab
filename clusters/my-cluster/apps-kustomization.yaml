apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: config
    - name: migrations
  interval: 1m0s
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: default
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: gatus
      namespace: default
    - apiVersion: apps/v1
      kind: Deployment
      name: homepage
      namespace: default
    - apiVersion: apps/v1
      kind: Deployment
      name: homepage-limited
      namespace: default
    - apiVersion: apps/v1
      kind: Deployment
      name: homepage-router
      namespace: default
  timeout: 5m
