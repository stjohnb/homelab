apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasette
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: datasette
  template:
    metadata:
      labels:
        app: datasette
    spec:
      automountServiceAccountToken: false
      priorityClassName: low-priority
      enableServiceLinks: false
      # RWO local-path volume shared with the datasette-sync CronJob; both
      # workloads carry this affinity so they land on the same (24/7) node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/gpu
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/storage
                    operator: DoesNotExist
      containers:
        - name: datasette
          image: datasetteproject/datasette:0.65.2
          command:
            - datasette
          args:
            - serve
            - /data
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /-/versions.json
              port: 8001
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /-/versions.json
              port: 8001
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/versions.json
              port: 8001
            periodSeconds: 10
          volumeMounts:
            - mountPath: /data
              name: datasette-data
      volumes:
        - name: datasette-data
          persistentVolumeClaim:
            claimName: datasette-data
