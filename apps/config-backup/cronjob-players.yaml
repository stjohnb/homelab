---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: config-backup-players
  labels:
    app: config-backup
spec:
  # 02:05, not 01:00. The NAS is woken by Home Assistant at 02:00 and powers
  # itself off at 03:03 Europe/London (nixos-config
  # systemd.timers.nightly-shutdown; see its docs/nas-duty-cycle.md), so the
  # only usable window is ~02:03-03:03. This Job runs on the always-on k3s
  # node but its destination is the hard-mounted media-pvc, so it needs the
  # NAS awake too; at 01:00 it failed on every night the box was not woken by
  # hand. 02:05 + the 3000s deadline finishes by 02:55, clear of poweroff.
  schedule: "5 2 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Finished Jobs self-delete after 48h. Without this, failedJobsHistoryLimit
      # keeps a Failed Job (and its pod) forever — it is only pruned by the *next*
      # failure — so a fixed problem keeps re-alerting: the 2026-09-09 apk-pin
      # failure (#1211) was re-filed as a workload alert three times (#1211, #1217,
      # #1228) from one 12-hour-old pod. 48h is far longer than the 5m `for` on the
      # two Grafana *-job-failed rules, which read kube_job_status_failed and so
      # need the Job object to still exist when they evaluate.
      ttlSecondsAfterFinished: 172800
      # 3000s, not 3600s: a real run takes ~2 minutes even with Plex's ~11G
      # config tree, so this is mount-wait slack, and 02:05 + 3600s would run
      # past the 03:03 poweroff.
      activeDeadlineSeconds: 3000
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: config-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          priorityClassName: low-priority
          # No nodeSelector: every config PVC here (plex, jellyfin since #800,
          # jellyseerr and seerr) is a local-path volume on k3s, and this Job
          # has to follow them.
          containers:
            - name: config-backup
              image: alpine:3.24
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                  # Root alone can't read Plex's 0600 files owned by uid 972
                  # (Preferences.xml, .LocalAdminToken) once ALL is dropped, and
                  # the script also needs to chown -wal/-shm back to the app and
                  # chmod staged files it does not own. See docs/config-backups.md.
                  add:
                    - DAC_READ_SEARCH
                    - DAC_OVERRIDE
                    - CHOWN
                    - FOWNER
              command:
                - /bin/sh
                - /scripts/backup.sh
              env:
                # app:owner-uid:owner-gid — jellyfin and jellyseerr 2.7.3 run as
                # root, plex as 972, and the seerr preview image as node (1000).
                - name: APPS
                  value: "plex:972:972 jellyfin:0:0 jellyseerr:0:0 seerr:1000:1000 navidrome:1000:1000"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: plex-config
                  mountPath: /config/plex
                - name: jellyfin-config
                  mountPath: /config/jellyfin
                - name: jellyseerr-config
                  mountPath: /config/jellyseerr
                - name: seerr-config
                  mountPath: /config/seerr
                - name: navidrome-data
                  mountPath: /config/navidrome
                - name: media
                  mountPath: /media
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 1000m
          volumes:
            - name: script
              configMap:
                name: config-backup-script
                defaultMode: 0555
            - name: plex-config
              persistentVolumeClaim:
                claimName: plex-config
            - name: jellyfin-config
              persistentVolumeClaim:
                claimName: jellyfin-config
            - name: jellyseerr-config
              persistentVolumeClaim:
                claimName: jellyseerr-config
            - name: seerr-config
              persistentVolumeClaim:
                claimName: seerr-config
            - name: navidrome-data
              persistentVolumeClaim:
                claimName: navidrome-data-pvc
            # The hard-mounted media-pvc, never media-soft-pvc — a backup that
            # rides a soft mount can be silently truncated by an EIO.
            - name: media
              persistentVolumeClaim:
                claimName: media-pvc
