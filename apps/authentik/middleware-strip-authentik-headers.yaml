# Pre-auth half of the authentik-auth-basic(-ext) chains. Unlike
# authentik-strip-headers it leaves Authorization in place, so an HTTP Basic
# app password reaches the Authentik outpost (intercept_header_auth), which
# validates it against Authentik. X-authentik-* are still cleared here and
# re-added only from ForwardAuth's authResponseHeaders, so they cannot be
# spoofed. Used by the Grafana and Prometheus auth-basic chains and, standalone
# (no ForwardAuth), by the Grafana Bearer IngressRoute
# (apps/monitoring/grafana-bearer-ingressroute.yaml); see
# docs/authentik.md "Claws service accounts".
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-strip-authentik-headers
  namespace: default
spec:
  headers:
    customRequestHeaders:
      X-authentik-username: ""
      X-authentik-groups: ""
      X-authentik-email: ""
      X-authentik-name: ""
      X-authentik-uid: ""
      X-authentik-grafana-role: ""
