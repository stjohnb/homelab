# Group-aware router for home.bstjohn.net (#1079).
# Traefik's authentik-auth chain strips any client-sent X-authentik-* headers
# and then overwrites X-authentik-groups from Authentik's ForwardAuth response,
# so this header cannot be forged from outside. Router rules in Traefik are
# evaluated BEFORE middleware, which is why the split happens here and not in
# the IngressRoute.
#
# Admin preview (#1095): a user in `infra` can view the limited dashboard by
# visiting /preview/limited, which sets the host-only cookie homepage_view=limited
# and redirects to /. The cookie is only honoured when $is_admin is 1, so it has
# no effect for anyone else. /preview/exit clears it.
events {
    worker_connections 1024;
}

http {
    upstream homepage_full {
        server homepage:3000;
    }
    upstream homepage_limited {
        server homepage-limited:3000;
    }

    # Authentik joins group names with "|", e.g. "all-apps|infra|authentik Admins".
    map $http_x_authentik_groups $is_admin {
        default                 0;
        "~(^|\|)infra(\||$)"    1;
    }

    # Exact-string entries are checked before regexes, so "1:limited" wins over "~^1:".
    map "$is_admin:$cookie_homepage_view" $route {
        default         limited;
        "~^1:"          full;
        "1:limited"     preview;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    server {
        listen 8080;

        # nginx's absolute_redirect defaults to ON: any Location starting with
        # "/" (from `return 302 /` below, or rewritten from an upstream by
        # `proxy_redirect default`) is expanded to "<scheme>://<host>:<port>/"
        # using the port this server listens on and the scheme of the *inbound*
        # connection. Traefik terminates TLS, so behind the ingress that turned
        # /preview/limited into a 302 to http://home.bstjohn.net:8080/ —
        # unreachable from a browser (#1097). Relative redirects resolve against
        # https://home.bstjohn.net correctly, so keep this off.
        absolute_redirect off;

        # Router-only liveness: must not depend on either Homepage pod.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Admin-only: start previewing the limited dashboard. add_header lives
        # inside the if so non-admins get a plain redirect with no cookie.
        location = /preview/limited {
            if ($is_admin) {
                add_header Set-Cookie "homepage_view=limited; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax";
                return 302 /;
            }
            return 302 /;
        }

        # Leave preview mode (harmless for anyone else).
        location = /preview/exit {
            add_header Set-Cookie "homepage_view=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax";
            return 302 /;
        }

        location / {
            # `if` cannot contain proxy_pass safely alongside the location's own
            # proxy_pass; the error_page -> named-location hop is the safe idiom.
            error_page 418 = @full;
            error_page 419 = @preview;
            if ($route = full) {
                return 418;
            }
            if ($route = preview) {
                return 419;
            }

            # Pin the Host so both Homepage pods only ever need
            # "home.bstjohn.net" in HOMEPAGE_ALLOWED_HOSTS for proxied traffic.
            proxy_set_header Host home.bstjohn.net;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://homepage_limited;
        }

        location @full {
            proxy_set_header Host home.bstjohn.net;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://homepage_full;
        }

        # Same backend as the non-admin path, plus a banner so the admin can
        # tell it is a preview and get back. sub_filter cannot rewrite a
        # compressed body, so ask Homepage for an identity encoding here only.
        location @preview {
            proxy_set_header Host home.bstjohn.net;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '</body>' '<div id="homepage-preview-banner" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;padding:0.5rem 1rem;background:#0f172a;color:#e2e8f0;border-top:1px solid #334155;font:inherit;font-size:0.875rem;text-align:center">Previewing the shared dashboard (what users outside the infra group see). <a href="/preview/exit" style="color:#38bdf8;text-decoration:underline">Back to the admin dashboard</a></div></body>';
            proxy_pass http://homepage_limited;
        }
    }
}
