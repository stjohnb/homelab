apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  targetNamespace: cert-manager
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Measured 2026-11-17: 30-day peak working set 59 MiB. BestEffort was the
    # first victim of the 2026-11-17 node-wide OOM.
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    # Measured 2026-11-17: 30-day peak working set 77 MiB. BestEffort was the
    # first victim of the 2026-11-17 node-wide OOM.
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
    # Measured 2026-11-17: 30-day peak working set 91 MiB (controller). BestEffort was the
    # first victim of the 2026-11-17 node-wide OOM.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    crds:
      enabled: true
      keep: true
    global:
      # Applies to controller, webhook and cainjector. The webhook gates
      # Certificate admission, so it must preempt rather than wait on
      # node thinkcentre. Built-in class because cert-manager is cluster-critical.
      priorityClassName: system-cluster-critical
      leaderElection:
        namespace: cert-manager
