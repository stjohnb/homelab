                              type: lt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: loki-no-lines-ingested
                  title: Loki Log Ingestion Stalled
                  condition: B
                  for: 30m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Loki has ingested fewer than one log line in 30 minutes
                    description: >-
                      End-to-end log-delivery check. Gatus's /ready probe and the
                      promtail-daemonset-not-ready rule are both readiness checks:
                      a promtail pod stays Ready while pushing into a black hole
                      (wrong client URL, Loki returning 429/400, corrupt positions
                      file) and Loki stays /ready while ingesting nothing. This
                      watches the distributor's received-lines counter instead, so
                      it covers both halves of the pipeline. The `or on() vector(0)`
                      fallback makes it fire rather than go NoData when the metric
                      is absent entirely (Loki down, or its ServiceMonitor not
                      selected by Prometheus). A cluster running Traefik, Flux and
                      Authentik never legitimately produces zero lines for 30
                      minutes. Check `kubectl logs -n default -l
                      app.kubernetes.io/name=promtail --tail=50` for push errors,
                      and the loki target under Prometheus > Status > Targets.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 3600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          sum(increase(loki_distributor_lines_received_total[30m]))
                          or on() vector(0)
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
