apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: default
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    # PVC is RWO — rolling update would deadlock waiting for the old pod
    # to release the volume before the new pod can mount it.
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: standard
      terminationGracePeriodSeconds: 30
      runtimeClassName: nvidia
      # Requires the GPU worker node to be joined and the nvidia-device-plugin
      # DaemonSet to be Ready before this deployment can schedule.
      # See docs/gpu-k3s.md for the setup and migration procedure.
      nodeSelector:
        node-role.kubernetes.io/gpu: "true"
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:0.5.4
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /
              port: 11434
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
