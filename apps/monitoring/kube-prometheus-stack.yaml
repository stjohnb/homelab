                - uid: workload-rollout-stalled
                  title: Workload Rollout Stalled
                  condition: C
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: >-
                      Deployment {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.deployment {{ "}}" }}
                      rollout is stalled
                    description: >-
                      The Deployment's Progressing condition is False — the
                      rollout has stalled (e.g. a new ReplicaSet cannot progress
                      within progressDeadlineSeconds). An image bump merged while
                      a node-pinned Deployment's node is asleep leaves its pod
                      unschedulable until the deadline trips, so the Deployments
                      known to sleep with k3s-nas or ryzen (see
                      workload-pod-pending) are excluded only while that node is
                      not Ready — a new node-pinned Deployment must be added to
                      the matching per-node regex here and in the other two
                      Workload rules. Wrapped in `max by (namespace,
                      deployment)` so a kube-state-metrics pod replacement
                      doesn't restart the `for: 15m` timer on an ongoing
                      stall — see workload-deployment-replicas-mismatch. Check
                      `kubectl rollout status deployment -n {{ "{{" }} $labels.namespace {{ "}}" }}
                      {{ "{{" }} $labels.deployment {{ "}}" }}`.
