---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: containerd-gc
spec:
  schedule: "0 4 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # See apps/unifi/cronjob-backup.yaml: 48h so a fixed failure stops re-alerting.
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: containerd-gc
        spec:
          hostPID: true
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: containerd-gc
              image: busybox:1.37
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  # logfmt: msg is always quoted; a field value is quoted (with " and \
                  # escaped) unless it is a bare token, so call sites just use key="$v".
                  _logesc() { printf '%s' "$1" | tr '\n\t' '  ' | sed 's/[\\"]/\\&/g'; }
                  log() {
                    _line="level=$1 msg=\"$(_logesc "$2")\" component=containerd-gc"
                    shift 2
                    for _kv in "$@"; do
                      _v=${_kv#*=}
                      case $_v in
                        ''|*[!A-Za-z0-9._:/@+,-]*) _v="\"$(_logesc "$_v")\"" ;;
                      esac
                      _line="$_line ${_kv%%=*}=$_v"
                    done
                    printf '%s\n' "$_line"
                  }
                  # crictl lives in /usr/local/bin on Debian k3s and in
                  # /run/current-system/sw/bin on NixOS k3s. nsenter inherits the
                  # *container's* PATH into the host mount namespace, where neither
                  # is guaranteed — so set PATH explicitly inside the host shell.
                  HOST_PATH=/run/current-system/sw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                  host() {
                    nsenter -t 1 -m -- /bin/sh -c "PATH=$HOST_PATH; export PATH; $*"
                  }
                  if ! host 'command -v crictl' >/dev/null 2>&1; then
                    log error "crictl not found on host" host_path="$HOST_PATH"
                    exit 1
                  fi
                  host 'crictl rmi --prune'
              resources:
                requests:
                  memory: 64Mi
                  cpu: 100m
                limits:
                  memory: 256Mi
                  cpu: 500m
              securityContext:
                privileged: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: containerd-gc-storage
spec:
  schedule: "30 4 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # See apps/unifi/cronjob-backup.yaml: 48h so a fixed failure stops re-alerting.
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: containerd-gc
        spec:
          hostPID: true
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/storage: "true"
          tolerations:
            - key: node-role.kubernetes.io/storage
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: node.kubernetes.io/disk-pressure
              operator: Exists
              effect: NoSchedule
          containers:
            - name: containerd-gc
              image: busybox:1.37
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  # logfmt: msg is always quoted; a field value is quoted (with " and \
                  # escaped) unless it is a bare token, so call sites just use key="$v".
                  _logesc() { printf '%s' "$1" | tr '\n\t' '  ' | sed 's/[\\"]/\\&/g'; }
                  log() {
                    _line="level=$1 msg=\"$(_logesc "$2")\" component=containerd-gc-storage"
                    shift 2
                    for _kv in "$@"; do
                      _v=${_kv#*=}
                      case $_v in
                        ''|*[!A-Za-z0-9._:/@+,-]*) _v="\"$(_logesc "$_v")\"" ;;
                      esac
                      _line="$_line ${_kv%%=*}=$_v"
                    done
                    printf '%s\n' "$_line"
                  }
                  # See containerd-gc above: nsenter carries the container's PATH into
                  # the host mount namespace. k3s-nas runs NixOS, where crictl is at
                  # /run/current-system/sw/bin/crictl and /usr/bin is essentially empty.
                  HOST_PATH=/run/current-system/sw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                  host() {
                    nsenter -t 1 -m -- /bin/sh -c "PATH=$HOST_PATH; export PATH; $*"
                  }
                  log info "starting prune"
                  if ! host 'command -v crictl' >/dev/null 2>&1; then
                    log error "crictl not found on host" host_path="$HOST_PATH"
                    exit 1
                  fi
                  log info "images before prune" images="$(host 'crictl images -q' | wc -l)"
                  host 'crictl rmi --prune'
                  rc=$?
                  if [ "$rc" -eq 0 ]; then
                    log info "crictl rmi --prune finished" exit_code="$rc"
                  else
                    log error "crictl rmi --prune finished" exit_code="$rc"
                  fi
                  log info "images after prune" images="$(host 'crictl images -q' | wc -l)"
                  log info "finished"
                  exit $rc
              resources:
                requests:
                  memory: 64Mi
                  cpu: 100m
                limits:
                  memory: 256Mi
                  cpu: 500m
              securityContext:
                privileged: true
