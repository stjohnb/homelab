---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  labels:
    app: plex
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # The restored config is ~11G (4.5G Metadata, 5.1G Media artwork, 1.3G
      # databases). 30Gi leaves room for metadata growth without another
      # resize.
      storage: 30Gi
  storageClassName: local-path
