apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-proxmox-temperature
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Proxmox
data:
  proxmox-temperature.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "CPU Package Temp",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 80 }
                ]
              },
              "color": { "mode": "thresholds" }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(node_hwmon_temp_celsius{instance=\"proxmox\"} and on(instance, chip) node_hwmon_chip_names{instance=\"proxmox\", chip_name=~\"k10temp|coretemp\"})",
              "instant": true,
              "legendFormat": "CPU Package"
            }
          ]
        },
        {
          "title": "NVMe Temp",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 70 }
                ]
              },
              "color": { "mode": "thresholds" }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(node_hwmon_temp_celsius{instance=\"proxmox\", chip=\"nvme_nvme0\"})",
              "instant": true,
              "legendFormat": "NVMe"
            }
          ]
        },
        {
          "title": "All Sensors",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_hwmon_temp_celsius{instance=\"proxmox\"} * on(instance, chip) group_left(chip_name) node_hwmon_chip_names{instance=\"proxmox\"}",
              "legendFormat": "{{chip_name}} / {{sensor}}"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["proxmox", "temperature", "hardware"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "Proxmox Temperature",
      "uid": "proxmox-temperature"
    }
