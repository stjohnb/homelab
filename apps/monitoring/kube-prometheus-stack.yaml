                - uid: proxmox-nvme-temp-critical
                  title: Proxmox NVMe Temperature Critical
                  condition: C
                  for: 2m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: critical
                  annotations:
                    summary: >-
                      Proxmox NVMe temperature is {{ "{{" }} printf "%.0f" $values.B.Value {{ "}}" }}°C (CRITICAL)
                    description: >-
                      Proxmox NVMe drive has been above 80°C for 2 minutes and is thermally
                      throttling. Investigate airflow immediately — sustained heat shortens flash life.
                  data:
                    - refId: A
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          max(node_hwmon_temp_celsius{instance="proxmox", chip="nvme_nvme0"})
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator:
                              params: []
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - B
                            reducer:
                              type: last
                            type: query
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        reducer: last
                        refId: B
                        type: reduce
                    - refId: C
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator:
                              params:
                                - 80
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - C
                            reducer:
                              type: last
                            type: query
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: B
                        refId: C
                        threshold:
                          conditions:
                            - evaluator:
                                params:
                                  - 80
                                type: gt
                        type: threshold
            - orgId: 1
              name: Authentik
              folder: Alerts
              interval: 1m
              rules:
                - uid: authentik-worker-db-errors
                  title: Authentik Worker Database Errors
                  condition: B
                  for: 10m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: critical
                  annotations:
                    summary: authentik-worker is logging PostgreSQL errors continuously
                    description: >-
                      Either the shared postgres instance is out of connection slots
                      ("remaining connection slots are reserved for roles with the SUPERUSER
                      attribute" in kubectl logs deploy/postgres -- check
                      `select usename, count(*) from pg_stat_activity group by 1` for the
                      hog), or the worker holds dead psycopg connections after a PostgreSQL
                      restart and does not recover on its own -- its port-9000 healthcheck
                      keeps returning 200 while every task fails, so liveness never restarts
                      it (verified again 2026-09-09, #936/#1235). While this fires, blueprints
                      are not applied, so newly merged ForwardAuth/OIDC providers 404 even
                      though the pod reports Ready. Fix with
                      kubectl rollout restart deployment/authentik-worker.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 900
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: sum(increase(django_db_errors_total{job="authentik-worker"}[15m])) or vector(0)
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 10
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: authentik-worker-task-errors
                  title: Authentik Worker Task Errors
                  condition: B
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: authentik-worker background tasks are failing
                    description: >-
                      Includes authentik.blueprints.v1.tasks.apply_blueprint failures — a
                      sustained rate means declarative provider/application config in
                      apps/authentik/configmap-blueprints.yaml is not reaching Authentik. Check
                      kubectl logs deploy/authentik-worker.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 3600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: sum(increase(authentik_tasks_errors_total{job="authentik-worker"}[1h])) or vector(0)
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 5
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: authentik-worker-down
                  title: Authentik Worker Metrics Target Down
                  condition: B
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: The authentik-worker Prometheus target has been unscrapeable for 15 minutes
                    description: >-
                      While this fires, the two Authentik worker alerts above are blind rather
                      than healthy. Check the authentik-worker pod in the default namespace.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: absent(up{job="authentik-worker"} == 1)
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
            - orgId: 1
              name: Postgres
              folder: Alerts
              interval: 1m
              rules:
                - uid: postgres-connection-saturation
                  title: Postgres Connection Saturation
                  condition: B
                  for: 3m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Shared PostgreSQL backends are above 70% of max_connections
                    description: >-
                      Backends on the shared postgres instance are above 70% of
                      max_connections (200). At 100% every non-superuser client is refused
                      with "remaining connection slots are reserved for roles with the
                      SUPERUSER attribute", which took out Authentik SSO and Forgejo for
                      2.5 minutes on 2026-09-09 (#1235). Find the holder with
                      `topk(5, sum by (usename, datname, state) (pg_stat_activity_count))`
                      and adjust that role's cap in
                      migrations/0031-postgres-connection-limits.sh -- it is repeatable, so
                      the edit applies on the next Flux reconcile.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) * 100
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 70
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: authentik-postgres-role-cap
                  title: Authentik Postgres Connections Near Role Cap
                  condition: B
                  for: 2m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Authentik is within 20 connections of its Postgres role cap
                    description: >-
                      The authentik role is capped at 110 in
                      migrations/0031-postgres-connection-limits.sh. Crossing it does not
                      degrade gracefully -- Postgres refuses the client with
                      "too many connections for role", which takes down SSO and every
                      ForwardAuth-protected host at once, and then amplifies itself
                      because dramatiq retries each failed task and every retry opens
                      another connection pool (#1256). Resting footprint is 25-38; boot
                      demand peaks near 100 while the 25-task outpost_send_update fan-out
                      runs (one task per authentik_outposts_outpost_providers row, each
                      with its own 4-connection pool held ~4.5 min). Sustained firing
                      outside a pod rollout means a new fan-out source. See
                      docs/authentik.md "Connection footprint".
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: sum(pg_stat_activity_count{usename="authentik"})
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 90
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: postgres-exporter-target-down
                  title: Postgres Exporter Target Down
                  condition: B
                  for: 15m
                  # absent() returns 1 only when the series is EMPTY, so a healthy
                  # target produces NO data and NoData is the healthy state here.
                  # noDataState: Alerting inverted the rule and made it fire 15m
                  # after every Grafana restart with the exporter up (#1244, #1260).
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Prometheus is not scraping postgres-exporter
                    description: >-
                      While this fires, Postgres Connection Saturation is blind rather than
                      healthy -- it will read as OK no matter how full the instance is.
                      Confirm it is real before digging: query
                      `up{job="postgres-exporter"}` in Prometheus, and only if it is 0 or
                      missing check `kubectl logs deploy/postgres-exporter` and the
                      allow-list in apps/postgres/networkpolicy.yaml (the exporter needs
                      `app: postgres-exporter` in the podSelector values list).
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 900
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: absent(up{job="postgres-exporter"} == 1)
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
            - orgId: 1
              name: Flux
              folder: Alerts
              interval: 1m
              rules:
                - uid: flux-kustomization-not-ready
                  title: Flux Kustomization Not Ready
                  condition: B
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: critical
                  annotations:
                    summary: >-
                      Flux Kustomization {{ "{{" }} $labels.exported_namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }}
                      has been Ready=False for 15m
                    description: >-
                      A Flux Kustomization has stayed Ready=False past the pending period,
                      long enough to ride out a routine kube-prometheus-stack upgrade window
                      (see docs/monitoring.md, "No Helm wait"). Check
                      `flux get kustomizations -A` and `kubectl logs -n flux-system
                      deploy/kustomize-controller` for the failing reconciliation.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          max by (exported_namespace, name) (gotk_resource_info{customresource_kind="Kustomization",
                          ready="False", suspended!="true"})
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: flux-helmrelease-not-ready
                  title: Flux HelmRelease Not Ready
                  condition: B
                  for: 30m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: critical
                  annotations:
                    summary: >-
                      Flux HelmRelease {{ "{{" }} $labels.exported_namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }}
                      has been Ready=False for 30m
                    description: >-
                      A Flux HelmRelease has stayed Ready=False past the pending period. 30m
                      exceeds the 20m upgrade.timeout on kube-prometheus-stack (with
                      disableWait: true a normal upgrade now settles in seconds), so this is
                      not a transient upgrade window — see docs/monitoring.md, "No Helm wait".
                      Check `flux get helmreleases -A` and `kubectl logs -n flux-system
                      deploy/helm-controller` for the failing release.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          max by (exported_namespace, name) (gotk_resource_info{customresource_kind="HelmRelease",
                          ready="False", suspended!="true"})
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
      grafana.ini:
        security:
          # Required for the dashpi wall display to iframe a public dashboard.
          # Grafana sends `x-frame-options: deny` unless this is true. Note this
          # is instance-wide: the authenticated UI also stops sending the header.
          # ForwardAuth still gates every non-public path.
          allow_embedding: true
        public_dashboards:
          # Explicit; default is already true in Grafana 12.
          enabled: true
        auth.proxy:
          enabled: true
          header_name: X-authentik-username
          header_property: username
          # true so Authentik users (including the claws-reader / claws-admin service
          # accounts) get a Grafana user on first login. Safe: only Traefik pods reach
          # :3000, the outpost is the only source of X-authentik-* headers, and the role
          # is re-synced from the header on every login.
          auto_sign_up: true
          # Role comes from Authentik group membership (infra / authentik Admins /
          # claws-admin -> Admin, everyone else -> Viewer) via grafana-role-scope-mapping;
          # SyncOrgRoles re-applies it on every login, so it survives a Grafana PVC rebuild.
          headers: "Name:X-authentik-name Email:X-authentik-email Role:X-authentik-grafana-role"
          # Pod-network whitelist is gated by NetworkPolicy (grafana-networkpolicy.yaml) — only Traefik pods can reach :3000.
          whitelist: "10.42.0.0/16"
        auth:
          disable_login_form: false
      podDisruptionBudget:
        minAvailable: 1
      ingress:
        enabled: true
        ingressClassName: traefik-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: default-authentik-auth-basic@kubernetescrd
        hosts:
          - grafana.home.bstjohn.net
        tls:
          - hosts:
              - grafana.home.bstjohn.net
            secretName: wildcard-home-tls

    # --- Prometheus ---
    prometheus:
      # Headlamp's bundled prometheus plugin auto-detects a Prometheus by
      # looking for this label first (headlamp-k8s/plugins, prometheus
      # plugin). Labelling the Service — not the pod — keeps detection on the
      # services/proxy path so the read-only role never needs pods/proxy.
      service:
        labels:
          headlamp-prometheus: "true"
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      # Scrapes the four Flux controllers directly (gotk_reconcile_duration_seconds*,
      # controller_runtime_* and workqueue_* only — Flux v2 controllers do not emit
      # gotk_reconcile_condition, so per-object Ready state comes from kube-state-metrics
      # custom resource state instead, see the kube-state-metrics subchart override below
      # and docs/monitoring.md#flux-controllers). podMonitorNamespaceSelector below is {}
      # (all namespaces), and flux-system's allow-scraping NetworkPolicy already admits
      # port 8080 from any namespace, so no NetworkPolicy change is needed. The chart
      # template stamps release: kube-prometheus-stack on the rendered PodMonitor, which is
      # load-bearing for the Prometheus CR's podMonitorSelector — see docs/logging.md, "Health".
      additionalPodMonitors:
        - name: flux-system
          jobLabel: app
          namespaceSelector:
            matchNames: [flux-system]
          selector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - source-controller
                  - kustomize-controller
                  - helm-controller
                  - notification-controller
          podMetricsEndpoints:
            - port: http-prom
              relabelings:
                - sourceLabels: [__meta_kubernetes_pod_phase]
                  action: keep
                  regex: Running
      prometheusSpec:
        priorityClassName: critical-infrastructure
        retention: 30d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        additionalScrapeConfigs:
          - job_name: pve-exporter
            metrics_path: /pve
            params:
              module: [default]
              target: ["192.168.0.200"]
            static_configs:
              - targets: ["pve-exporter:9221"]
            relabel_configs:
              - source_labels: [__param_target]
                target_label: instance
          - job_name: cert-manager
            static_configs:
              - targets: ["cert-manager.cert-manager.svc.cluster.local:9402"]
          - job_name: authentik
            metrics_path: /metrics
            static_configs:
              - targets: ["authentik-server:9300"]
          - job_name: authentik-worker
            metrics_path: /metrics
            static_configs:
              - targets: ["authentik-worker:9300"]
          - job_name: gatus
            metrics_path: /metrics
            static_configs:
              - targets: ["gatus.default.svc.cluster.local:8080"]
          - job_name: jellyfin-reconciler
            metrics_path: /metrics
            static_configs:
              - targets: ["jellyfin.default.svc.cluster.local:9101"]
          # Sonarr/Radarr config-reconciler sidecars (apps/servarr/reconcile.py).
          # Both run on k3s-nas, so these targets are down while the NAS
          # sleeps; the Servarr Health rules treat no data as OK.
          - job_name: sonarr-reconciler
            metrics_path: /metrics
            static_configs:
              - targets: ["sonarr.default.svc.cluster.local:9101"]
          - job_name: radarr-reconciler
            metrics_path: /metrics
            static_configs:
              - targets: ["radarr.default.svc.cluster.local:9101"]
          - job_name: proxmox-node-exporter
            static_configs:
              - targets: ["192.168.0.200:9100"]
                labels:
                  instance: proxmox
          - job_name: postgres-exporter
            static_configs:
              - targets: ["postgres-exporter.default.svc.cluster.local:9187"]
      ingress:
        enabled: true
        ingressClassName: traefik-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: default-authentik-auth-basic@kubernetescrd
        hosts:
          - prometheus.home.bstjohn.net
        tls:
          - hosts:
              - prometheus.home.bstjohn.net
            secretName: wildcard-home-tls

    # --- Default rule overrides ---
    defaultRules:
      disabled:
        KubeNodeNotReady: true
        KubeNodeUnreachable: true
        KubeletDown: true
        PrometheusNotConnectedToAlertmanagers: true

    additionalPrometheusRulesMap:
      custom-node-rules:
        groups:
          - name: kubernetes-system-node.custom
            rules:
              - alert: KubeNodeNotReady
                expr: >-
                  kube_node_status_condition{job="kube-state-metrics",
                  condition="Ready",status="true",
                  node!~"ryzen|k3s-nas"} == 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  description: >-
                    {{ $labels.node }} has been unready for more than 15 minutes.
                  runbook_url: >-
                    https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubenodenotready
                  summary: "Node {{ $labels.node }} is not ready."
              - alert: KubeNodeUnreachable
                expr: >-
                  kube_node_spec_taint{job="kube-state-metrics",
                  key="node.kubernetes.io/unreachable",effect="NoSchedule",
                  node!~"ryzen|k3s-nas"} == 1
                for: 0m
                labels:
                  severity: warning
                annotations:
                  description: >-
                    {{ $labels.node }} is unreachable and some workloads may be rescheduled.
                  runbook_url: >-
                    https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubenodeunreachable
                  summary: "Node {{ $labels.node }} is unreachable."
              - alert: KubeletDown
                expr: >-
                  up{job="kubelet", metrics_path="/metrics",
                  node!~"ryzen|k3s-nas"} == 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  description: >-
                    Kubelet on {{ $labels.node }} is down.
                  runbook_url: >-
                    https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeletdown
                  summary: "Kubelet on {{ $labels.node }} is unreachable."

    # --- Alertmanager (disabled — Gatus + Slack handles alerting) ---
    alertmanager:
      enabled: false

    # --- Node Exporter ---
    nodeExporter:
      enabled: true
    # Subchart override: kube-prometheus-stack exposes node-exporter as the
    # `prometheus-node-exporter` subchart. Pin it to system-node-critical so
    # kubelet evicts it last under resource pressure, preserving node metrics
    # during a DiskPressure incident on k3s-nas.
    prometheus-node-exporter:
      priorityClassName: system-node-critical

    # --- kube-state-metrics ---
    kubeStateMetrics:
      enabled: true
    # Subchart override: enables custom resource state so kube-state-metrics exports
    # gotk_resource_info{customresource_kind, exported_namespace, name, ready, suspended}
    # for Flux Kustomization/HelmRelease objects. Flux v2 controllers only emit
    # gotk_reconcile_duration_seconds -- not gotk_reconcile_condition -- so this is the
    # only source of per-object Ready state (upstream fluxcd/flux2-monitoring-example
    # pattern). Deliberately no `collectors: []` / `--custom-resource-state-only`: the
    # CronJob/PVC/node rules in this file depend on the default core KSM collectors.
    # Source kinds are out of scope. See docs/monitoring.md#flux-reconciliation-alerts.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: [kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
            resources: [kustomizations, helmreleases]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_source_name: [spec, chart, spec, sourceRef, name]

    # --- k3s-specific: disable components that k3s bundles internally ---
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
