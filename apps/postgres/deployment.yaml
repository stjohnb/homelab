# Shared PostgreSQL instance for Authentik, Immich, Garden, Forgejo and Claws — see docs/postgres.md.
#
# Per-app roles and databases are created ONLY by the numbered migration scripts
# (`migrations/00NN-*-db*.sh`) via `kubectl exec` into this pod. Never add an
# init script under /docker-entrypoint-initdb.d: that directory runs on first
# initialisation of an empty data directory only, so any app onboarded after
# this volume was created would be silently skipped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # Single ReadWriteOnce local-path volume — never run two pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: critical-infrastructure
      terminationGracePeriodSeconds: 90
      # Keep postgres off the GPU node (ryzen) and the NAS node (k3s-nas).
      # Both carry NoSchedule taints this pod does not tolerate; the affinity is
      # belt-and-braces in case a taint is ever removed. The local-path volume
      # must stay on the 24/7 k3s node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/gpu
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/storage
                    operator: DoesNotExist
      containers:
        # No `command:` override. The image ships
        # /usr/local/bin/immich-docker-entrypoint.sh, which writes its own
        # postgresql.conf and preloads vchord.so — replacing the entrypoint
        # silently drops the vector extension Immich needs.
        #
        # The legacy pgvecto.rs (`vectors`) layer was dropped once
        # migrations/0027-immich-drop-pgvecto-rs.sh completed. vectors.so is no
        # longer preloaded, so NEVER roll Immich back below v1.133 after this:
        # older releases write `vectors`-typed objects this image cannot open.
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3@sha256:2c6e74ea2c5d4d784f5eece3d25c8d1c8872623537eb048483a913fcfb3587cc
          # `args:` replaces the image CMD only — NEVER set `command:`, which
          # would bypass immich-docker-entrypoint.sh and drop the vchord.so
          # preload. `config_file=` must stay first and unchanged; it is what the
          # entrypoint's tuning template is written to.
          #
          # max_connections: the initdb default of 100 was already exhausted by
          # 2026-09-09 13:45:01 BST (257 x "remaining connection slots are
          # reserved for roles with the SUPERUSER attribute" over ~2.5 minutes),
          # about 100s before the Forgejo pod that joined this instance (#1216)
          # even started -- so who held the other slots is unattributed
          # (log_connections was off; #1235). authentik-worker could not connect
          # either and exited 1, surfacing as the "Authentik Worker Database
          # Errors" alert (#1233). Forgejo's pool (MAX_OPEN_CONNS defaults to
          # 100 -- the whole server as it stood that day) is now capped as
          # prevention against the next tenant-induced squeeze, not as the fix
          # for this one.
          # Command-line -c beats postgresql.conf. log_connections/
          # log_disconnections are on so the next squeeze is attributable.
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - max_connections=200
            - -c
            - superuser_reserved_connections=5
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
          ports:
            - containerPort: 5432
          env:
            - name: TZ
              value: Europe/London
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              # 200 backends x ~5-10MB on top of shared_buffers=512MB; the old
              # 256Mi/2Gi envelope was sized for max_connections=100.
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          # pg_isready, not tcpSocket: the postmaster accepts connections while
          # still replaying WAL after an unclean shutdown.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
