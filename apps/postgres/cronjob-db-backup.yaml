apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-db-backup
  labels:
    app: postgres
spec:
  schedule: "30 2 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # See apps/unifi/cronjob-backup.yaml: 48h so a fixed failure stops re-alerting.
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            component: db-backup
            claws.st-john-software.com/nfs-dependent: "true"
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          # Pinned to the storage node (k3s-nas) because the backups land on the
          # NFS media share. The NAS is powered off most of the time and this job
          # is pointless without it, so it must fail cleanly here rather than run
          # without storage. See docs/nas-k3s.md.
          nodeSelector:
            node-role.kubernetes.io/storage: "true"
          tolerations:
            - key: node-role.kubernetes.io/storage
              operator: Equal
              value: "true"
              effect: NoSchedule
          securityContext:
            fsGroup: 70
          initContainers:
            - name: init-backup-dir
              image: busybox:1.36
              command: ["sh", "-c", "mkdir -p /media/backups/postgres && chown 70:70 /media/backups/postgres"]
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: media
                  mountPath: /media
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              securityContext:
                runAsUser: 70
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-superuser
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  # logfmt: msg is always quoted; a field value is quoted (with " and \
                  # escaped) unless it is a bare token, so call sites just use key="$v".
                  _logesc() { printf '%s' "$1" | tr '\n\t' '  ' | sed 's/[\\"]/\\&/g'; }
                  log() {
                    _line="level=$1 msg=\"$(_logesc "$2")\" component=db-backup job=postgres-db-backup"
                    shift 2
                    for _kv in "$@"; do
                      _v=${_kv#*=}
                      case $_v in
                        ''|*[!A-Za-z0-9._:/@+,-]*) _v="\"$(_logesc "$_v")\"" ;;
                      esac
                      _line="$_line ${_kv%%=*}=$_v"
                    done
                    printf '%s\n' "$_line"
                  }

                  BACKUP_ROOT="/media/backups/postgres"

                  # Wait up to 10 minutes for postgres. An unreachable database
                  # FAILS rather than exiting 0 — an extended outage must be
                  # visible, not a silent skip.
                  log info "checking postgres availability" host=postgres
                  ATTEMPT=1
                  until pg_isready --host=postgres --username=postgres --timeout=5 --quiet; do
                    if [ "${ATTEMPT}" -ge 10 ]; then
                      log error "postgres unreachable" attempts=10 waited_s=600
                      exit 1
                    fi
                    log info "postgres not ready, waiting" attempt="${ATTEMPT}" max_attempts=10 wait_s=60
                    ATTEMPT=$((ATTEMPT + 1))
                    sleep 60
                  done

                  # `immich` is deliberately excluded: apps/immich/cronjob-db-backup.yaml
                  # already dumps it 6-hourly with content assertions (asset/user row
                  # counts) that this generic job cannot make. `postgres` is the empty
                  # maintenance database.
                  DATABASES="$(psql -v ON_ERROR_STOP=1 -h postgres -U postgres -tAc \
                    "select datname from pg_database where datistemplate = false and datname not in ('postgres', 'immich')")"

                  # Empty is expected during the multi-PR migration onto this shared
                  # instance, before any app database has moved over yet — not a failure.
                  if [ -z "${DATABASES}" ]; then
                    log info "no application databases on shared instance yet, nothing to back up"
                    exit 0
                  fi

                  log info "databases to back up" databases="${DATABASES}"

                  for DB in ${DATABASES}; do
                    BACKUP_DIR="${BACKUP_ROOT}/${DB}"
                    mkdir -p "${BACKUP_DIR}"
                    BACKUP_FILE="${BACKUP_DIR}/${DB}-$(date +%Y%m%d-%H%M%S).pgdump"

                    log info "starting pg_dump" db="${DB}" path="${BACKUP_FILE}"
                    pg_dump -h postgres -U postgres -d "${DB}" --format=custom --file="${BACKUP_FILE}"

                    # Post-dump verification. Every failure removes the bad file and
                    # exits non-zero BEFORE the retention rm, so a bad dump can neither
                    # be kept nor evict the last good one.
                    if ! pg_restore --list "${BACKUP_FILE}" > /tmp/toc.txt; then
                      log error "pg_restore --list could not read dump, removing it" db="${DB}" path="${BACKUP_FILE}"
                      rm -f "${BACKUP_FILE}"
                      exit 1
                    fi

                    BYTES="$(wc -c < "${BACKUP_FILE}")"
                    if [ "${BYTES}" -le 0 ]; then
                      log error "dump is empty, removing it" db="${DB}" path="${BACKUP_FILE}" bytes="${BYTES}"
                      rm -f "${BACKUP_FILE}"
                      exit 1
                    fi

                    log info "backup verified" db="${DB}" path="${BACKUP_FILE}" bytes="${BYTES}"

                    # Grandfather-father-son rotation, same rule as
                    # immich-db-backup. Only reached on a verified dump.
                    sh /scripts/gfs-prune.sh "${BACKUP_DIR}" '*.pgdump' postgres-db-backup
                    log info "current backups" db="${DB}" dir="${BACKUP_DIR}"
                    ls -lht "${BACKUP_DIR}"/*.pgdump
                  done
              volumeMounts:
                - name: media
                  mountPath: /media
                - name: retention-script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: media-pvc
            - name: retention-script
              configMap:
                name: db-backup-retention-script
                defaultMode: 0555
