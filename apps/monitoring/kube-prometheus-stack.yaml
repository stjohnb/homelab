apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: default
spec:
  interval: 30m
  # disableWait on all three actions: Helm's --wait gates on every resource in
  # the release, including the prometheus-node-exporter DaemonSet. Helm needs
  # numberReady >= desired - maxUnavailable (3 - 1 = 2). With one worker off
  # that holds (numberReady 2); with BOTH `ryzen` (GPU) and `k3s-nas` (storage)
  # off — the normal overnight state — numberReady drops to 1 and the check can
  # never pass, so every upgrade blocked for the full 20m and failed, then the
  # rollback blocked on the same DaemonSet and failed too. Health is covered by
  # Gatus probes of the Grafana and Prometheus endpoints instead.
  # See docs/monitoring.md.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: true
    remediation:
      retries: 3
  rollback:
    timeout: 20m
    disableWait: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "72.9.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  values:
    # --- Grafana ---
    grafana:
      priorityClassName: critical-infrastructure
      enabled: true
      # Disable init-chown-data container — it fails on existing PVCs when
      # subdirectories (csv, png, pdf) already exist with different ownership.
      # Safe to disable with local-path storage.
      initChownData:
        enabled: false
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: custom
              orgId: 1
              folder: Custom
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/custom
      dashboards:
        custom:
          proxmox:
            gnetId: 10347
            revision: 5
            datasource: Prometheus
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      envValueFrom:
        SLACK_WEBHOOK_URL:
          secretKeyRef:
            name: grafana-slack-webhook
            key: webhook-url
            optional: true
        GRAFANA_GITHUB_WEBHOOK_TOKEN:
          secretKeyRef:
            name: grafana-webhook-shared-secret
            key: token
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: Slack - PVC
              receivers:
                - uid: slack-pvc
                  type: slack
                  settings:
                    url: $__env{SLACK_WEBHOOK_URL}
                  disableResolveMessage: false
            - orgId: 1
              name: Slack - CronJobs
              receivers:
                - uid: slack-cronjob-alerts
                  type: slack
                  settings:
                    url: $__env{SLACK_WEBHOOK_URL}
                  disableResolveMessage: false
            - orgId: 1
              name: GitHub Issues
              receivers:
                - uid: github-issues
                  type: webhook
                  settings:
                    url: http://grafana-github-alerts.default.svc.cluster.local:8080/webhook
                    httpMethod: POST
                    authorization_scheme: Bearer
                    authorization_credentials: $__env{GRAFANA_GITHUB_WEBHOOK_TOKEN}
                  disableResolveMessage: false
            - orgId: 1
              name: Slack - Node
              receivers:
                - uid: slack-node-alerts
                  type: slack
                  settings:
                    url: $__env{SLACK_WEBHOOK_URL}
                  disableResolveMessage: false
            - orgId: 1
              name: Slack - Proxmox
              receivers:
                - uid: slack-proxmox-alerts
                  type: slack
                  settings:
                    url: $__env{SLACK_WEBHOOK_URL}
                  disableResolveMessage: false
            - orgId: 1
              name: Slack - DNS
              receivers:
                - uid: slack-dns-alerts
                  type: slack
                  settings:
                    url: $__env{SLACK_WEBHOOK_URL}
                  disableResolveMessage: false
            - orgId: 1
              name: Slack - Authentik
              receivers:
                - uid: slack-authentik-alerts
                  type: slack
                  settings:
                    url: $__env{SLACK_WEBHOOK_URL}
                  disableResolveMessage: false
        policies.yaml:
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: grafana-default-email
              group_by:
                - grafana_folder
                - alertname
              routes:
                # Terminal route (no `continue`) — evaluation stops here, so this known
                # standing condition never reaches the GitHub Issues webhook. Slack only,
                # re-notified monthly, and always visible in the Grafana Alerting UI.
                - receiver: Slack - CronJobs
                  object_matchers:
                    - ["alertname", "=~", "^Immich Database Is Empty$"]
                  group_by:
                    - alertname
                  group_wait: 30s
                  group_interval: 1h
                  repeat_interval: 720h
                - receiver: GitHub Issues
                  group_by:
                    - alertname
                  group_wait: 1m
                  group_interval: 5m
                  repeat_interval: 24h
                  continue: true
                  object_matchers:
                    - ["alertname", "!~", "KubeNodeNotReady|KubeNodeUnreachable|KubeletDown"]
                - receiver: Slack - PVC
                  object_matchers:
                    - ["alertname", "=~", "PVC.*"]
                  group_by:
                    - namespace
                    - persistentvolumeclaim
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                - receiver: Slack - Node
                  object_matchers:
                    - ["alertname", "=~", "Node.*"]
                  group_by:
                    - alertname
                    - node
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                - receiver: Slack - Proxmox
                  object_matchers:
                    - ["alertname", "=~", "Proxmox.*"]
                  group_by:
                    - alertname
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                - receiver: Slack - CronJobs
                  object_matchers:
                    - ["alertname", "=~", ".*Job.*|.*Schedule.*|.*Running Too Long"]
                  group_by:
                    - alertname
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                - receiver: Slack - DNS
                  object_matchers:
                    - ["alertname", "=~", "^CoreDNS.*"]
                  group_by:
                    - alertname
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                - receiver: Slack - Authentik
                  object_matchers:
                    - ["alertname", "=~", "^Authentik.*"]
                  group_by:
                    - alertname
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
        rules.yaml:
          apiVersion: 1
          groups:
            - orgId: 1
              name: PVC Capacity
              folder: Alerts
              interval: 5m
              rules:
                - uid: pvc-warning
                  title: PVC Usage Warning (80%)
                  condition: C
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: >-
                      PVC {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }}
                      is {{ "{{" }} printf "%.1f" $values.B.Value {{ "}}" }}% full
                  data:
                    - refId: A
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (
                            kubelet_volume_stats_used_bytes
                            / kubelet_volume_stats_capacity_bytes
                          )
                          * on(namespace, persistentvolumeclaim) group_left(storageclass)
                            kube_persistentvolumeclaim_info{storageclass="local-path"}
                          * 100
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator:
                              params: []
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - B
                            reducer:
                              type: last
                            type: query
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        reducer: last
                        refId: B
                        type: reduce
                    - refId: C
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator:
                              params:
                                - 80
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - C
                            reducer:
                              type: last
                            type: query
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: B
                        refId: C
                        threshold:
                          conditions:
                            - evaluator:
                                params:
                                  - 80
                                type: gt
                        type: threshold
                - uid: pvc-critical
                  title: PVC Usage Critical (90%)
                  condition: C
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: >-
                      PVC {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }}
                      is {{ "{{" }} printf "%.1f" $values.B.Value {{ "}}" }}% full — immediate action required
                  data:
                    - refId: A
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (
                            kubelet_volume_stats_used_bytes
                            / kubelet_volume_stats_capacity_bytes
                          )
                          * on(namespace, persistentvolumeclaim) group_left(storageclass)
                            kube_persistentvolumeclaim_info{storageclass="local-path"}
                          * 100
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator:
                              params: []
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - B
                            reducer:
                              type: last
                            type: query
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        reducer: last
                        refId: B
                        type: reduce
                    - refId: C
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator:
                              params:
                                - 90
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - C
                            reducer:
                              type: last
                            type: query
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: B
                        refId: C
                        threshold:
                          conditions:
                            - evaluator:
                                params:
                                  - 90
                                type: gt
                        type: threshold
            - orgId: 1
              name: CronJob Monitoring
              folder: Alerts
              interval: 1m
              rules:
                - uid: immich-db-backup-job-failed
                  title: Immich DB Backup Job Failed
                  condition: B
                  for: 5m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: critical
                  annotations:
                    summary: Immich DB backup job has failed
                    description: >-
                      The most recent immich-db-backup job failed for a reason other than the
                      NFS mount deadline or an empty database — the backup container ran and
                      either could not reach Postgres, produced a dump pg_restore --list cannot
                      read, produced a dump whose TOC is missing public.asset or public.user, or
                      produced a dump at or below the 17 MB geodata-only floor.
                      Check `kubectl logs -l component=db-backup`.
                      Existing backups were not rotated, so the last good dump is intact.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (kube_job_status_failed{namespace="default",
                          job_name=~"immich-db-backup-[0-9]+",
                          reason!~"DeadlineExceeded|PodFailurePolicy"} > 0)
                          and on(job_name, namespace)
                          topk(1, kube_job_status_start_time{namespace="default",
                          job_name=~"immich-db-backup-[0-9]+"})
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: immich-db-empty
                  title: Immich Database Is Empty
                  condition: B
                  for: 30m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Immich database is empty — backup refused, manual recovery needed
                    description: >-
                      immich-db-backup refused to dump because `select count(*) from asset` and
                      `select count(*) from "user"` are both 0 (container exit 3, Job failure
                      reason PodFailurePolicy). Existing backups were NOT rotated: the newest
                      verified dump in /mnt/SSD-POOL/media/backups/immich/ is intact, so restore
                      from it first — see docs/immich.md, Restore Procedure. postgres-data
                      is node-local local-path storage on the k3s worker and is excluded from the
                      nightly config-backup CronJob, so a lost worker disk means a lost database;
                      that is exactly how the 2026-04-09/10 loss happened. If no usable dump
                      exists, the fallback proven on 2026-08-10 is to create a fresh admin user
                      and re-import the originals from /mnt/SSD-POOL/media/photos/upload with
                      immich-go. See docs/immich.md History.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (kube_job_status_failed{namespace="default",
                          job_name=~"immich-db-backup-[0-9]+", reason="PodFailurePolicy"} > 0)
                          and on(job_name, namespace)
                          topk(1, kube_job_status_start_time{namespace="default",
                          job_name=~"immich-db-backup-[0-9]+"})
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: immich-db-backup-duration-exceeded
                  title: Immich DB Backup Running Too Long
                  condition: B
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Immich DB backup job has been running for over 10 minutes
                    description: >-
                      An immich-db-backup job has been running for more than 10 minutes.
                      When the NAS is offline, the pod waits up to 30 minutes for the NFS mount
                      before timing out — this is expected. If the NAS is online, check pod logs
                      for a hung pg_dump, database locks, or resource exhaustion.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (time() - kube_job_status_start_time{namespace="default",
                          job_name=~"immich-db-backup-[0-9]+"}) and on(job_name, namespace)
                          (kube_job_status_active{namespace="default",
                          job_name=~"immich-db-backup-[0-9]+"} > 0)
                          and on()
                          (kube_node_status_condition{node="k3s-nas",
                          condition="Ready", status="true"} == 1)
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 600
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: containerd-gc-job-failed
                  title: Containerd GC Job Failed
                  condition: B
                  for: 1m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Containerd GC job has failed
                    description: >-
                      A failed job was detected for the containerd-gc CronJob.
                      Unresolved failures will eventually lead to disk exhaustion from accumulated container images.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          kube_job_status_failed{namespace="default",
                          job_name=~"containerd-gc-[0-9]+"}
                          and on(job_name, namespace)
                          topk(1, kube_job_status_start_time{namespace="default",
                          job_name=~"containerd-gc-[0-9]+"})
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: containerd-gc-storage-job-failed
                  title: Containerd GC Storage Job Failed
                  condition: B
                  for: 5m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Containerd GC storage job has failed
                    description: >-
                      A failed job was detected for the containerd-gc-storage CronJob
                      while the NAS storage node (k3s-nas) has been continuously Ready
                      for at least 26 hours (i.e. at least one scheduled run elapsed under
                      healthy conditions). Unresolved failures will eventually lead to disk
                      exhaustion from accumulated container images on the storage node.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (kube_job_status_failed{namespace="default",
                          job_name=~"containerd-gc-storage-[0-9]+"}
                          and on(job_name, namespace)
                          topk(1, kube_job_status_start_time{namespace="default",
                          job_name=~"containerd-gc-storage-[0-9]+"})
                          )
                          and on()
                          (min_over_time((max by (node) (kube_node_status_condition{node="k3s-nas",
                          condition="Ready", status="true"}))[26h:1m]) == 1)
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: immich-db-backup-schedule-missed
                  title: Immich DB Backup Schedule Missed
                  condition: B
                  for: 5m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: critical
                  annotations:
                    summary: Immich DB backup has not run in over 12 hours
                    description: >-
                      The immich-db-backup CronJob has not produced a new job in more than 12 hours
                      (2x its 6-hour interval). The CronJob may be suspended or the scheduler may have failed.
                      Before the first scheduled run this is measured from the CronJob's creation
                      timestamp, so a CronJob that never schedules at all still alerts.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (time() - max by (cronjob) (kube_cronjob_status_last_schedule_time{cronjob="immich-db-backup",
                          namespace="default"} > 0))
                          or
                          (time() - max by (cronjob) (kube_cronjob_created{cronjob="immich-db-backup",
                          namespace="default"}))
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 43200
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: containerd-gc-schedule-missed
                  title: Containerd GC Schedule Missed
                  condition: B
                  for: 5m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Containerd GC has not run in over 2 days
                    description: >-
                      The containerd-gc or containerd-gc-storage CronJob has not produced a new job in more than 2 days
                      (2x its daily interval). The CronJob may be suspended or the scheduler may have failed.
                      Prolonged failure leads to disk exhaustion. Before the first scheduled run this is
                      measured from the CronJob's creation timestamp, so a CronJob that never schedules
                      at all still alerts.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (time() - max by (cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~"containerd-gc(-storage)?",
                          namespace="default"} > 0))
                          or
                          (time() - max by (cronjob) (kube_cronjob_created{cronjob=~"containerd-gc(-storage)?",
                          namespace="default"}))
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 172800
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: forgejo-backup-job-failed
                  title: Forgejo Backup Job Failed
                  condition: B
                  for: 5m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: critical
                  annotations:
                    summary: Forgejo nightly backup job has failed
                    description: >-
                      A failed job was detected for the forgejo-backup CronJob — either
                      `forgejo dump` errored or content verification rejected the archive.
                      This job writes to a local-path PVC on the 24/7 node and has no NFS
                      dependency, so any failure is real: Forgejo has no fresh backup.
                      See docs/forgejo-backups.md.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          kube_job_status_failed{namespace="default",
                          job_name=~"forgejo-backup-[0-9]+"}
                          and on(job_name, namespace)
                          topk(1, kube_job_status_start_time{namespace="default",
                          job_name=~"forgejo-backup-[0-9]+"})
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: forgejo-offsite-backup-job-stale
                  title: Forgejo Offsite Backup Job Stale
                  condition: B
                  for: 30m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: No Forgejo backup has been copied to the NAS in over 14 days
