apiVersion: v1
kind: Service
metadata:
  name: radarr
  labels:
    app: radarr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7878
      targetPort: 7878
      protocol: TCP
    # config-reconciler sidecar metrics, scraped by Prometheus job
    # radarr-reconciler (docs/monitoring.md).
    - name: metrics
      port: 9101
      targetPort: 9101
      protocol: TCP
  selector:
    app: radarr
