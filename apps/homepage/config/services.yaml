        description: Claws
    # Containerized staging StatefulSet (apps/claws/statefulset-staging.yaml),
    # distinct from the production Claws proxy above. Claws authenticates
    # natively via Authentik OIDC, so /status is behind auth — the monitor
    # targets the unauthenticated /health endpoint instead.
    - Claws (staging):
        icon: mdi-cat
        href: https://claws-staging.home.bstjohn.net
        siteMonitor: https://claws-staging.home.bstjohn.net/health
        description: Claws (staging)
    - Forgejo:
        icon: forgejo.png
        href: https://git.home.bstjohn.net
        siteMonitor: https://git.home.bstjohn.net
        description: Git Forge
    - Registry:
        icon: mdi-package-variant-closed
        href: https://registry.home.bstjohn.net
        # zot answers 405 to HEAD and 401 to an unauthenticated GET /v2/, so the
        # monitor targets the mgmt extension endpoint, which zot serves
        # anonymously with a real 200 (its own UI calls it to discover login
        # methods). Homepage falls back from HEAD to GET on any status > 403.
        siteMonitor: https://registry.home.bstjohn.net/v2/_zot/ext/mgmt
        description: Container Registry (zot)
