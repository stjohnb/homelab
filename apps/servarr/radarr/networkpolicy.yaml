apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radarr-ingress-restricted
  labels:
    app: radarr
spec:
  podSelector:
    matchLabels:
      app: radarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [prowlarr, bazarr, overseerr, jellyseerr, seerr, gatus]
      ports:
        - protocol: TCP
          port: 7878
