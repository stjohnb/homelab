apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml

# NOTE: `mealie-db-secret` is NOT in Git. It is created by
# migrations/0038-mealie-db.sh, which runs automatically on Flux reconcile.
# Never declare it as a manifest resource — Flux SSA would reset .data every
# reconcile and wipe the generated password.
