apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./clusters/my-cluster/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: false — blanket health gating would include the HelmRepository sources,
  # so a transient chart-index fetch failure stalls the whole layer. Gate on the
  # HelmReleases only.
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: flux-system
  timeout: 5m
