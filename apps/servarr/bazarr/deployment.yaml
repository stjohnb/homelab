apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  labels:
    app: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      automountServiceAccountToken: false
      priorityClassName: low-priority
      enableServiceLinks: false
      # Pinned to the storage node (k3s-nas). The NAS is powered off most of
      # the time and this service is pointless without its media, so it must
      # fail cleanly here rather than run without storage. See docs/nas-k3s.md.
      nodeSelector:
        node-role.kubernetes.io/storage: "true"
      tolerations:
        - key: node-role.kubernetes.io/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        - name: set-external-auth
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              set -e
              CONFIG=/config/config/config.yaml
              # NOTE: On fresh install, config does not exist yet. The patch
              # is a no-op on first boot; auth is disabled on the next restart.
              # An empty file means an ungraceful shutdown truncated the config;
              # remove it so the app regenerates a valid one on startup.
              if [ -f "$CONFIG" ] && [ ! -s "$CONFIG" ]; then
                rm -f "$CONFIG"
              fi
              if [ -s "$CONFIG" ]; then
                sed -i '/^auth:/,/^[^[:space:]]/{s/^  type: .*/  type: none/}' "$CONFIG"
              fi
          volumeMounts:
            - name: bazarr-config
              mountPath: /config
      containers:
        - name: bazarr
          image: linuxserver/bazarr:1.5.6
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/London"
          ports:
            - name: http
              containerPort: 6767
              protocol: TCP
          volumeMounts:
            - name: bazarr-config
              mountPath: /config
            - name: media
              mountPath: /tv
              subPath: TV
            - name: media
              mountPath: /movies
              subPath: Movies
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /
              port: 6767
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 6767
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 6767
            periodSeconds: 10
            timeoutSeconds: 5

      volumes:
        - name: bazarr-config
          persistentVolumeClaim:
            claimName: bazarr-local-config-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc

      restartPolicy: Always
