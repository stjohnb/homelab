                            and on (namespace, deployment) (max by (namespace, deployment) (changes(kube_deployment_status_replicas_updated[10m])) == 0)
                          )
                          unless on (namespace, deployment) (
                            kube_deployment_spec_replicas{deployment=~"bazarr|immich|radarr|sonarr|transmission|forgejo-runner-nas"}
                            and on () (max by (node) (kube_node_status_condition{node="k3s-nas", condition="Ready", status="true"}) == 0)
                          )
                          unless on (namespace, deployment) (
