apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress-restricted
  namespace: default
  labels:
    app.kubernetes.io/name: loki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    # The single-binary ring gossips to itself over memberlist/gRPC.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: promtail
        - podSelector:
            matchLabels:
              app: gatus
        # Prometheus scrapes /metrics on 3100 via the chart's ServiceMonitor.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3100
