apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup-offsite
  labels:
    app: forgejo
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # See apps/unifi/cronjob-backup.yaml: 48h so a fixed failure stops re-alerting.
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 900
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: forgejo
            component: backup-offsite
            claws.st-john-software.com/nfs-dependent: "true"
        spec:
          # No nodeSelector: mounting the forgejo-backups local-path PVC pins
          # this pod to node k3s via the PV's node affinity. The NFS PV uses
          # soft/retry=0 so a powered-off NAS fails the job fast rather than
          # hanging the control-plane node.
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          initContainers:
            - name: init-backup-dir
              image: busybox:1.37
              command: ["sh", "-c", "mkdir -p /media/backups/forgejo && chown 1000:1000 /media/backups/forgejo"]
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: offsite
                  mountPath: /media
          containers:
            - name: sync
              image: busybox:1.37
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: TZ
                  value: Europe/London
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  SRC=/backups
                  DEST=/media/backups/forgejo
                  COPIED=0
                  # An interrupted copy leaves .<name>.partial behind, and neither
                  # the copy loop nor the retention line below matches dotfiles.
                  # Pattern deliberately broad, mirroring the sweep in
                  # cronjob-backup.yaml. 24h age floor is safe because the copy
                  # loop rm -f's the partial for a dump it is about to re-copy;
                  # only partials of dumps already aged out of Stage 1 linger.
                  find "${DEST}" -maxdepth 1 -type f -name '.forgejo-dump-*' \
                    -mmin +1440 -exec rm -v {} \; || true
                  for f in "${SRC}"/forgejo-dump-*.tar.gz; do
                    if [ ! -e "$f" ]; then
                      echo "FATAL: /backups holds no forgejo-dump-*.tar.gz."
                      echo "Stage 1 (forgejo-backup CronJob) has produced no archive."
                      echo "This is a Stage 1 failure, NOT the NAS being powered off."
                      echo "Check: kubectl logs -l component=backup -n default"
                      echo "See docs/forgejo-backups.md."
                      exit 1
                    fi
                    base="$(basename "$f")"
                    if [ -f "${DEST}/${base}" ]; then continue; fi
                    part="${DEST}/.${base}.partial"
                    size="$(stat -c %s "$f")"
                    echo "Copying ${base} (${size} bytes)..."
                    rm -f "${part}"
                    # Chunked dd with conv=fsync, NOT cp. A plain cp to NFS leaves
                    # the whole file as dirty page cache charged to this pod's memory
                    # cgroup; NFS has no cgroup-writeback support, so the cgroup OOMs
                    # before the kernel throttles the writer. With ~302 MB dumps that
                    # killed the second copy of a catch-up run at a 256Mi limit on
                    # 2026-09-10 (pod forgejo-backup-offsite-29816760-n4zz9, exit 137,
                    # issue #1261). An fsync every 64 MiB bounds peak dirty pages no
                    # matter how large the dumps grow. Offsets are in bs=1M blocks.
                    blocks=$(( (size + 1048575) / 1048576 ))
                    off=0
                    while [ "${off}" -lt "${blocks}" ]; do
                      dd if="$f" of="${part}" bs=1M skip="${off}" seek="${off}" \
                        count=64 conv=notrunc,fsync 2>/dev/null || {
                          echo "FATAL: dd failed copying ${base} at block offset ${off}"
                          rm -f "${part}"; exit 1
                        }
                      off=$((off + 64))
                    done
                    if [ "$(stat -c %s "${part}" 2>/dev/null)" != "${size}" ]; then
                      echo "FATAL: short copy of ${base} ($(stat -c %s "${part}" 2>/dev/null) != ${size})"
                      rm -f "${part}"; exit 1
                    fi
                    chmod 0640 "${part}"
                    mv "${part}" "${DEST}/${base}"
                    COPIED=$((COPIED + 1))
                  done
                  echo "Copied ${COPIED} new dump(s) to NFS."
                  cd "${DEST}"
                  ls -t forgejo-dump-*.tar.gz | tail -n +15 | xargs -r rm -v
                  echo "Offsite backups:"; ls -lht forgejo-dump-*.tar.gz
              volumeMounts:
                - name: backups
                  mountPath: /backups
                  readOnly: true
                - name: offsite
                  mountPath: /media
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: forgejo-backups
                readOnly: true
            - name: offsite
              persistentVolumeClaim:
                claimName: forgejo-backup-pvc
