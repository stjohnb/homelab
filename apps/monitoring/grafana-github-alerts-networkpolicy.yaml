apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-github-alerts-ingress-from-grafana-only
  namespace: default
  labels:
    app: grafana-github-alerts
spec:
  podSelector:
    matchLabels:
      app: grafana-github-alerts
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 8080
