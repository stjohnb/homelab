                              type: lt
                              params:
                                - 1
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: uncovered-job-failed
                  title: Uncovered Job Failed
                  condition: C
                  for: 10m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: >-
                      Job {{ "{{" }} $labels.job_name {{ "}}" }} in
                      {{ "{{" }} $labels.namespace {{ "}}" }} failed and has no
                      dedicated CronJob alert
                    description: >-
                      This Job failed and is not covered by a per-CronJob rule above
                      (Immich, containerd-gc, containerd-gc-storage, Forgejo backup,
                      Forgejo offsite backup, config-backup, config-backup-players,
                      postgres-db-backup, downloads-janitor, pages-janitor,
                      unifi-backup, datasette-sync-sqlite) or by
                      migration-runner-job-failed. Today this
                      catches renovate,
                      datasette-sync, admission-error-reaper, tofu-provider-mirror-*
                      and any future CronJob. Run
                      `kubectl get job -n {{ "{{" }} $labels.namespace {{ "}}" }}
                      {{ "{{" }} $labels.job_name {{ "}}" }}` and read the pod log.
                      Adding a per-CronJob rule for a new owner means adding its
                      name to the exclusion regex in this rule's expression too.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (
                            max by (namespace, job_name) (kube_job_status_failed > 0)
                            and on (namespace, job_name)
                            topk by (namespace, owner_name) (1,
                              max by (namespace, job_name, owner_name) (
                                kube_job_status_start_time
                                * on (namespace, job_name) group_left(owner_name)
                                kube_job_owner{owner_kind="CronJob",
                                owner_name!~"immich-db-backup|containerd-gc|containerd-gc-storage|forgejo-backup|forgejo-backup-offsite|config-backup|config-backup-players|postgres-db-backup|downloads-janitor|pages-janitor|unifi-backup|datasette-sync-sqlite"}
                              )
                            )
                          )
                          or
                          (
                            max by (namespace, job_name) (kube_job_status_failed{job_name!="migration-runner"} > 0)
                            unless on (namespace, job_name) kube_job_owner{owner_kind="CronJob"}
                          )
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    # reduce + threshold (not classic_conditions) so every failed Job is its own
                    # alert instance and $labels.namespace / $labels.job_name are populated.
                    - refId: B
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator:
                              params: []
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - B
                            reducer:
                              type: last
                            type: query
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        reducer: last
                        refId: B
                        type: reduce
                    - refId: C
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator:
                              params:
                                - 0
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - C
                            reducer:
                              type: last
                            type: query
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: B
                        refId: C
                        threshold:
                          conditions:
                            - evaluator:
                                params:
                                  - 0
                                type: gt
                        type: threshold
