                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: >-
                      Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }}
                      is stuck Pending
                    description: >-
                      A pod already bound to a node is dropped while that node is
                      not Ready, like the other Workload rules. An unscheduled
                      Pending pod carries no node label, so that guard cannot
                      protect it; instead the Deployments known to leave a Pending
                      replacement pod for the whole daily downtime of k3s-nas
                      (bazarr, immich, radarr, sonarr, transmission,
                      forgejo-runner-nas) or ryzen (ollama, whisper,
                      forgejo-runner-ryzen) are excluded only while that node is
                      not Ready, so a real scheduling failure still alerts while the
                      node is awake — see docs/monitoring.md "Workload Health
                      Alerts". A new node-pinned Deployment must be added to the
                      matching per-node regex here and in
                      workload-deployment-replicas-mismatch and
                      workload-rollout-stalled. Also excludes a pod already
                      caught by Workload Container Waiting (ImagePullBackOff etc.
                      is phase Pending too), so one broken pod opens one GitHub
                      issue instead of two. Check
                      `kubectl describe pod -n {{ "{{" }} $labels.namespace {{ "}}" }}
                      {{ "{{" }} $labels.pod {{ "}}" }}` for the scheduling reason.
                  data:
                    - refId: A
                      queryType: ""
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (
                            (
                              max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"} == 1)
                              and on (namespace, pod) max by (namespace, pod) (kube_pod_owner{owner_kind!="Job"})
                            )
                            * on (namespace, pod) group_left(node) max by (namespace, pod, node) (kube_pod_info)
                          )
                          unless on (node) (max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0)
                          unless on (namespace, pod) (
                            max by (namespace, pod) (kube_pod_owner{owner_name=~"(bazarr|immich|radarr|sonarr|transmission|forgejo-runner-nas)-[a-z0-9]{5,10}"})
                            and on () (max by (node) (kube_node_status_condition{node="k3s-nas", condition="Ready", status="true"}) == 0)
                          )
                          unless on (namespace, pod) (
                            max by (namespace, pod) (kube_pod_owner{owner_name=~"(ollama|whisper|forgejo-runner-ryzen)-[a-z0-9]{5,10}"})
                            and on () (max by (node) (kube_node_status_condition{node="ryzen", condition="Ready", status="true"}) == 0)
                          )
