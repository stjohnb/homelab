apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cycling
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik-traefik
  tls:
  - hosts:
    - cycling.home.bstjohn.net
    - cycling.ext.bstjohn.net
    secretName: wildcard-home-tls
  rules:
  - host: cycling.home.bstjohn.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cycling
            port:
              number: 80
  - host: cycling.ext.bstjohn.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cycling
            port:
              number: 80
