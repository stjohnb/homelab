            - orgId: 1
              name: Cluster DNS
              folder: Alerts
              interval: 1m
              rules:
                - uid: coredns-servfail-rate
                  title: CoreDNS SERVFAIL Rate High
                  condition: B
                  for: 10m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: critical
                  annotations:
                    summary: CoreDNS is returning SERVFAIL for more than 5% of queries
                    description: >-
                      CoreDNS forwards to the resolv.conf it snapshotted at pod start, so a
                      regenerated node resolv.conf leaves it pointed at a dead upstream. Check
                      kubectl logs -n kube-system deploy/coredns, fix with kubectl rollout
                      restart deployment coredns -n kube-system.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (sum(rate(coredns_dns_responses_total{job="coredns", rcode="SERVFAIL"}[5m])) or vector(0))
                          / clamp_min(sum(rate(coredns_dns_responses_total{job="coredns"}[5m])) or vector(1), 0.01)
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        type: classic_conditions
                        refId: B
                        datasource:
                          type: __expr__
                          uid: __expr__
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0.05
                            operator:
                              type: and
                            query:
                              params:
                                - A
                            reducer:
                              type: last
                - uid: coredns-forward-broken
                  title: CoreDNS Upstream Unreachable
                  condition: B
