                - uid: promtail-daemonset-not-ready
                  title: Promtail DaemonSet Not Ready
                  condition: B
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels:
                    severity: warning
                  annotations:
                    summary: Promtail is not Ready on every node that is currently up
                    description: >-
                      The promtail HelmRelease sets disableWait: true (a 3-node
                      DaemonSet can never satisfy Helm's --wait when both
                      k3s-nas and ryzen are off), so Flux cannot detect a
                      functionally broken release on its own — see
                      docs/logging.md#health. This compares actual Ready
                      promtail pods against the count of Ready nodes rather
                      than the DaemonSet's own desired count, because desired
                      does not drop when a node is powered off (only when it
                      is removed from the cluster) — see docs/logging.md#health
                      for why. So this stays quiet when a node is intentionally
                      powered off and only fires when promtail itself is
                      failing on nodes that are up (e.g. CrashLoopBackOff
                      against the 200Mi memory limit), or when the DaemonSet
                      itself is missing entirely (deleted, or renamed by a
                      chart upgrade) — the second branch below covers that,
                      gated on kube-state-metrics being up so it doesn't
                      duplicate kube-state-metrics-down. Check
                      `kubectl get pods -n default -l app.kubernetes.io/name=promtail`.
                  data:
                    - refId: A
                      relativeTimeRange:
                        from: 600
                        to: 0
                      datasourceUid: prometheus
                      model:
                        expr: >-
                          (
                            kube_daemonset_status_number_ready{daemonset="promtail", namespace="default"}
                            - scalar(count(kube_node_status_condition{job="kube-state-metrics",
                            condition="Ready", status="true"} == 1))
                          )
                          or
                          (
                            absent(kube_daemonset_status_number_ready{daemonset="promtail", namespace="default"})
                            and on() (up{job="kube-state-metrics"} == 1)
                          ) * -1
                        instant: true
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
