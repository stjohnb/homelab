                    severity: critical
                  annotations:
                    summary: CoreDNS is returning SERVFAIL for more than 5% of queries
                    description: >-
                      CoreDNS forwards to the resolv.conf it snapshotted at pod start, so a
                      regenerated node resolv.conf leaves it pointed at a dead upstream. Check
                      kubectl logs -n kube-system deploy/coredns, fix with kubectl rollout
                      restart deployment coredns -n kube-system.
