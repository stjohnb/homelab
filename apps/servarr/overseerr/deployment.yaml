apiVersion: apps/v1
kind: Deployment
metadata:
  name: overseerr
  labels:
    app: overseerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overseerr
  template:
    metadata:
      labels:
        app: overseerr
    spec:
      automountServiceAccountToken: false
      priorityClassName: low-priority
      enableServiceLinks: false
      initContainers:
        - name: apikey-init
          image: python:3.14.1-alpine3.21
          command: ["python3", "/scripts/apikey-init.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # optional: true is load-bearing - a missing Secret would otherwise
            # put the pod into CreateContainerConfigError. With it the script
            # logs, skips the pin, and Overseerr serves with its own key.
            - name: OVERSEERR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: request-app-apikeys
                  key: overseerr-api-key
                  optional: true
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "DAC_READ_SEARCH"]
          volumeMounts:
            - name: overseerr-config
              mountPath: /config
            - name: apikey-init-script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 96Mi
              cpu: 200m
      containers:
        - name: overseerr
          image: linuxserver/overseerr:1.35.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/London"
          ports:
            - name: http
              containerPort: 5055
              protocol: TCP
          volumeMounts:
            - name: overseerr-config
              mountPath: /config
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 1000m
          # Probe /api/v1/status/appdata, NOT /api/v1/status: the latter calls
          # api.github.com for the update check and blocks ~5s whenever
          # external DNS is unavailable, which starved the 1s-default startup
          # probe and CrashLoopBackOff'd a perfectly healthy app (#832).
          livenessProbe:
            httpGet:
              path: /api/v1/status/appdata
              port: 5055
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /api/v1/status/appdata
              port: 5055
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/status/appdata
              port: 5055
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: overseerr-config
          persistentVolumeClaim:
            claimName: overseerr-local-config-pvc
        - name: apikey-init-script
          configMap:
            name: overseerr-apikey-init-script
            defaultMode: 0555

      restartPolicy: Always
