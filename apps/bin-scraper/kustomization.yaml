apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - address-secret.enc.yaml

# NOTE: bin-scraper requires pre-created Secrets that are NOT in Git:
#   - `bin-scraper-mqtt` with keys `username` and `password`
#   - `bin-scraper-forge-token` with key `token` (Forgejo PAT, user `brendan`,
#     scope `write:issue`; surfaced as the ISSUE_TOKEN env var — scrape-failure
#     issues are filed on git.home.bstjohn.net, not GitHub)
#   - `bin-scraper-session` with key `session-secret` (created by migration
#     0020-bin-scraper-session-secret.sh)
#
# We intentionally do NOT generate them here because Flux only has what is in Git,
# and we never commit credentials.
#
# address-secret.enc.yaml is SOPS-encrypted (age, see .sops.yaml) and holds the
# home postcode/address match for the scraper and missed-bin reporter — PII that
# must never appear in plaintext in Git (this repo has a public mirror).
#
# Both SCRAPER_ADDRESS_MATCH and REPORTER_ADDRESS_MATCH read the `address-match`
# key. SCRAPER_ADDRESS_MATCH is NOT optional in practice: when it is unset the
# app picks a RANDOM address from the council's dropdown (src/pageScraper.ts),
# which intermittently selects a non-selectable option and makes the scrape die
# on `Waiting for selector #ItemsGrid failed` (issue #906).
