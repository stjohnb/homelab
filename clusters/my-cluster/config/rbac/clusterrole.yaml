---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read-only-cluster-viewer
rules:
  # Core API group (excludes secrets)
  - apiGroups: [""]
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch"]

  # Apps
  - apiGroups: ["apps"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Batch
  - apiGroups: ["batch"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # RBAC (view roles and bindings)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Policy
  - apiGroups: ["policy"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Certificates (cert-manager CRDs)
  - apiGroups: ["cert-manager.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Flux CD CRDs
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Traefik CRDs
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # API extensions (CRDs)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Allow port-forward for debugging
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]

  # Allow viewing logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]

# Deny exec by default (uncomment to allow shell access)
# - apiGroups: [""]
#   resources: ["pods/exec"]
#   verbs: ["create", "get"]
