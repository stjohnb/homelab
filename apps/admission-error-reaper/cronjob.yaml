---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: admission-error-reaper
  labels:
    app: admission-error-reaper
spec:
  schedule: "*/5 * * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: admission-error-reaper
        spec:
          serviceAccountName: admission-error-reaper
          restartPolicy: Never
          enableServiceLinks: false
          priorityClassName: low-priority
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: alpine/k8s:1.37.1
              env:
                - name: HOME
                  value: /tmp
                - name: KUBECACHEDIR
                  value: /tmp/kubecache
              command:
                - /bin/sh
                - -c
                - |
                  # logfmt: msg is always quoted; a field value is quoted (with " and \
                  # escaped) unless it is a bare token, so call sites just use key="$v".
                  _logesc() { printf '%s' "$1" | tr '\n\t' '  ' | sed 's/[\\"]/\\&/g'; }
                  log() {
                    _line="level=$1 msg=\"$(_logesc "$2")\" component=admission-error-reaper"
                    shift 2
                    for _kv in "$@"; do
                      _v=${_kv#*=}
                      case $_v in
                        ''|*[!A-Za-z0-9._:/@+,-]*) _v="\"$(_logesc "$_v")\"" ;;
                      esac
                      _line="$_line ${_kv%%=*}=$_v"
                    done
                    printf '%s\n' "$_line"
                  }
                  names=$(kubectl get pods -n default \
                    --field-selector status.phase=Failed \
                    -o jsonpath='{range .items[?(@.status.reason=="UnexpectedAdmissionError")]}{.metadata.name}{" "}{end}')
                  if [ -z "$names" ]; then
                    log info "nothing to reap"
                    exit 0
                  fi
                  log info "deleting failed pods" pods="$names"
                  kubectl delete pod -n default $names || true
                  exit 0
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
