---
# StatefulSet rather than Deployment: claws#2752's k8s runtime needs a
# volumeClaimTemplate (the old standalone 1Gi PVC cannot be resized — the
# local-path StorageClass has no allowVolumeExpansion) and a stable pod
# identity for the 420s graceful shutdown. Only StatefulSet in this repo.
#
# Lives in its own Flux Kustomization (`claws`), not in apps/claws/,
# so it can `dependsOn` `claws-prepull` (#1373): a tag bump is only
# applied here once the pre-puller has the new image on node k3s, which cuts
# the rollout outage to shutdown + ~15s start. Its Service, Ingress, RBAC and
# Secrets stay in apps/claws/. The image tag must match
# clusters/my-cluster/claws-prepull/deployment.yaml (CI enforces it).
#
# This is production Claws. Every object here was named `claws-staging` until
# #1427 renamed it: the `-staging` suffix was a leftover from the openclaw ->
# k3s cutover (#1302), never a second tier. The rename re-bound the existing
# 50Gi PersistentVolume to the new PVC name `data-claws-0` by hand — see the
# cutover runbook in docs/apps-overview.md.
#
# serviceName points at Service/claws, a ClusterIP Service rather than
# headless, so per-pod DNS (claws-0.claws...) deliberately does not resolve.
# spec.serviceName is immutable, so restoring per-pod DNS later means
# repeating this same delete/recreate + PV re-bind procedure.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claws
  namespace: default
spec:
  replicas: 1
  serviceName: claws
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: claws
  template:
    metadata:
      labels:
        app: claws
    spec:
      # local-path volumes are node-local and the other two nodes are powered
      # off most of the day — pin to the control-plane node so a restart
      # always finds its data.
      nodeSelector:
        kubernetes.io/hostname: k3s
      serviceAccountName: claws
      # Needed (was false): the pod uses its own SA token to patch the
      # `claws-auth` Secret when a provider credential rotates. It must use the
      # projected token explicitly — the entrypoint writes ~/.kube/config from
      # CLAWS_KUBECONFIG, and kubectl prefers that over in-cluster config.
      automountServiceAccountToken: true
      enableServiceLinks: false
      priorityClassName: standard
      # 300s scheduler drain + 5s task-cancel + 60s memory flush + headroom.
      # Changing claws' shutdown() flush cap means changing this number.
      terminationGracePeriodSeconds: 420
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000
      containers:
        - name: claws
          image: ghcr.io/st-john-software/claws:v2026-10-02.2
          # Two Secrets by design: `claws-config` is long-lived static material
          # (SOPS-appropriate); `claws-auth` holds only rotating provider
          # credentials and is never committed in any form. Both optional so
          # these manifests reconcile green before either exists.
          # NOTE: the explicit env entries below WIN over envFrom — do not put
          # CLAWS_ACTIVATION_STATE or any CLAWS_OIDC_* key in either Secret.
          envFrom:
            - secretRef:
                name: claws-config
                optional: true
            - secretRef:
                name: claws-auth
                optional: true
          env:
            - name: CLAWS_ACTIVATION_STATE
              value: active
            # Where the pod writes a rotated provider credential back to.
            - name: CLAWS_AUTH_SECRET_NAME
              value: claws-auth
            - name: CLAWS_AUTH_SECRET_NAMESPACE
              value: default
            - name: CLAWS_OIDC_CLIENT_ID
              value: claws
            - name: CLAWS_OIDC_BASE_URL
              value: https://auth.home.bstjohn.net
            - name: CLAWS_OIDC_APPLICATION_SLUG
              value: claws
            - name: CLAWS_OIDC_REDIRECT_URI
              value: https://claws.home.bstjohn.net/auth/callback
            # Per-request OIDC host routing (claws#2841/#2842). A login reaching
            # the pod on claws.ext.bstjohn.net must use the ext-facing
            # Authentik host, not the internal-only auth.home one; claws matches
            # the (port-stripped, lowercased) X-Forwarded-Host against this map
            # and derives redirect_uri as https://<host>/auth/callback. The map
            # is an allow-list — an unmapped or spoofed Host falls back to
            # CLAWS_OIDC_BASE_URL/CLAWS_OIDC_REDIRECT_URI above, which is what
            # prevents an open redirect, so only add hosts this pod really serves.
            - name: CLAWS_OIDC_HOST_MAP
              value: claws.ext.bstjohn.net=https://auth.ext.bstjohn.net
            - name: CLAWS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: CLAWS_OIDC_CLIENT_SECRET
            # Ollama has no external Ingress since #611; claws' default
            # https://ollama.home.bstjohn.net now reaches Traefik's 404.
            # The classifier/verifier runs inside the cluster, so use the
            # ClusterIP Service directly.
            - name: CLAWS_OLLAMA_BASE_URL
              value: http://ollama.default.svc.cluster.local:11434
            # Base URL for the per-session claws-state MCP server (claws#3056).
            # Claws appends /mcp/sessions/<id> and strips any trailing /.
            # Empty value means k8s-pod sessions start without claws-state.
            # Session pods (claws-workload=session, namespace claws-sessions) reach
            # this pod on TCP 3000 from a cross-namespace call. If a NetworkPolicy
            # ever selects app=claws as ingress, or restricts claws-sessions
            # egress, add a rule allowing TCP 3000 for this traffic. Blocked traffic
            # only shows as claws-state "failed to connect" inside the session;
            # the session still starts. Changing the Service name or port means
            # changing this value.
            - name: CLAWS_SESSION_MCP_URL
              value: http://claws.default.svc.cluster.local:3000
            # Pins k8s-pod session pods to node k3s. The other two nodes are
            # often powered off, and session PVCs are node-local local-path,
            # same reasoning as this StatefulSet's own nodeSelector above.
            - name: CLAWS_SESSION_NODE_SELECTOR
              value: kubernetes.io/hostname=k3s
            # Requires the claws-sessions namespace's RBAC (#1328 PR 1) to
            # already be reconciled — Role claws-session-backend and its
            # RoleBinding to this ServiceAccount. Any value other than
            # local-tmux/k8s-pod fails config load and crash-loops this pod.
            # Rollback: delete this entry. Running session pods keep running;
            # clean one up with `kubectl -n claws-sessions delete pod,svc,secret,pvc
            # -l claws-workload-id=<id>`.
            - name: CLAWS_SESSION_BACKEND
              value: k8s-pod
            # Headless work-queue rows (refiner, implementer, pr-reviewer,
            # ci-fix, ...) run as claws-agent-<rowId> Pods in claws-sessions
            # (claws-workload: agent) instead of worker fibers in this pod, so
            # an image rollout no longer kills a 40-minute review. Requires
            # claws#3359 (image v2026-09-24.4 or later): the pod holds no DB
            # credentials and records everything through the agent-pod ops
            # API on this Service's TCP 3000 (CLAWS_SESSION_MCP_URL above).
            # Reuses the session backend's namespace, image, ghcr-pull Secret
            # and node selector; per-pod sizing is claws' CLAWS_AGENT_POD_*
            # defaults (2Gi request / 6Gi limit / 24Gi ephemeral / 20Gi HOME).
            # CLAWS_MAX_WORK_WORKERS still caps concurrent pods; the 10Gi
            # container limit below is now headroom rather than the worker
            # budget. Scheduler jobs that spawn agents themselves (e.g.
            # shopping-sourcer) stay in-process. Any value other than
            # in-process/k8s-pod fails config load and crash-loops this pod.
            # Rollback: delete this entry only once no pod-backed row is
            # `running` (in-process never re-queues those rows); clean one up
            # with `kubectl -n claws-sessions delete pod,secret
            # -l claws-workload-id=<rowId>`.
            - name: CLAWS_WORK_BACKEND
              value: k8s-pod
            # A headless worker can legitimately need about 4 GiB of RSS, so
            # the per-process watchdog stays at 4 GiB (claws#3168: observed
            # trees of 2.1-2.6 GiB were being killed under the old 2 GiB cap).
            # Two workers are affordable because the container limit below is
            # sized for the worst case rather than the observed case: 2 x 4 GiB
            # watchdog + ~1 GiB service < 10 GiB, so no overlap of two workers
            # can reach a kubelet OOM. Claws has no aggregate memory admission
            # yet (claws#3214 is open); until it lands, that headroom IS the
            # backpressure, so these two values must be changed together --
            # raising the worker count or the watchdog without raising the
            # limit re-introduces the whole-pod OOM this avoids.
            # Rollback: set this back to "1" (claws defaults to 2 when unset,
            # so delete-the-line is NOT a rollback).
            - name: CLAWS_CLAUDE_WORKER_MEMORY_MAX_BYTES
              value: "4294967296"
            - name: CLAWS_MAX_WORK_WORKERS
              value: "2"
            # Shared-Postgres connection (#1274). The URL is deliberately
            # passwordless: since claws#2974 (image v2026-09-10.9 and later)
            # buildPgConnectionConfig() in claws' src/db-driver-pg.ts merges
            # CLAWS_DATABASE_PASSWORD into the connection string's userinfo
            # before the pg Pool is built, and it takes precedence over any
            # password embedded in the URL. Env order is not load-bearing.
            #
            # Before that fix the password had to be interpolated into the URL
            # with kubelet $(VAR) expansion (#1299/#1300): pg@8.23 does
            # `Object.assign({}, config, parse(connectionString))` and
            # pg-connection-string@2.14 always sets `password: ""` for a
            # passwordless URL, so a separately passed password was discarded
            # and every boot died with `SASL: SCRAM-SERVER-FIRST-MESSAGE:
            # client password must be a string`. Do not restore the inline
            # form unless this pod is pinned to an image older than
            # v2026-09-10.9.
            #
            # CLAWS_DATABASE_PASSWORD is also the cross-repo contract with
            # claws#2953, and the `kubectl exec`-ed snapshot importer
            # (claws#2954) reads it.
            - name: CLAWS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claws-db-secret
                  key: password
            - name: CLAWS_DATABASE_URL
              value: postgres://claws@postgres.default.svc.cluster.local:5432/claws
            # Forgejo credentials, minted by migrations/0034-claws-forgejo-accounts.sh
            # (#1289) and 0037-claws-forgejo-read-token.sh (#1439). `clawsstjohn`
            # (team claws-bot, push-capable) is the implicit credential in every
            # Forgejo session. `claws-admin` (team Owners) is the owner-capable
            # opt-in `forgejo-admin` capability used only for Actions secrets/
            # variables. `claws-reader` (team claws-reader) is read/issue-only for
            # Claws cross-repo access. These variable names are cross-repo
            # contracts with claws#2965 and claws#3152; changing either side needs
            # both. optional: true so these manifests reconcile green before the
            # migrations have run.
            - name: CLAWS_FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claws-forgejo-tokens
                  key: service-token
                  optional: true
            - name: CLAWS_FORGEJO_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claws-forgejo-tokens
                  key: admin-token
                  optional: true
            - name: CLAWS_FORGEJO_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claws-forgejo-tokens
                  key: read-token
                  optional: true
            # Authentik service accounts for Grafana/Prometheus Basic auth
            # (docs/authentik.md "Claws service accounts"). migrations/0004
            # generates the app-password keys in authentik-secrets and 0040
            # restarts this pod once they exist; optional: true because this
            # Kustomization does not depend on migrations.
            - name: CLAWS_AUTHENTIK_READER_USERNAME
              value: claws-reader
            - name: CLAWS_AUTHENTIK_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: CLAWS_READER_APP_PASSWORD
                  optional: true
            - name: CLAWS_AUTHENTIK_ADMIN_USERNAME
              value: claws-admin
            - name: CLAWS_AUTHENTIK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: CLAWS_ADMIN_APP_PASSWORD
                  optional: true
            # Shared browser service (#1383, docs/browser.md). BROWSER_TOKEN is
            # minted by migrations/0036-browser-token.sh into the browser-token
            # Secret (key token); optional: true because this Kustomization
            # dependsOn only claws-prepull, not migrations. Env order
            # here is load-bearing: kubelet's $(VAR) expansion only sees env
            # vars declared earlier in this list, so BROWSER_TOKEN must stay
            # above CLAWS_BROWSER_CDP_ENDPOINT or the URL keeps the literal
            # $(BROWSER_TOKEN) unexpanded. If the Secret was missing when the
            # pod started, the URL also keeps that literal until the next
            # restart. Claws images before claws#3102 ignore this variable;
            # from claws#3102 on, Claws forwards it into k8s-pod session pods,
            # so claws-sessions needs no copy of browser-token. This is the
            # cross-repo contract with claws#3102 — renaming it needs both sides.
            - name: BROWSER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: browser-token
                  key: token
                  optional: true
            - name: CLAWS_BROWSER_CDP_ENDPOINT
              value: ws://browser.default.svc.cluster.local:3000/chromium?token=$(BROWSER_TOKEN)
            # Pages host (apps/garage, docs/pages.md). Claws ignores these until
            # follow-up issue #clw_01M3J52H0H9WSH3GTSY87ZY351 (generalise issue
            # previews and add a `pages` session capability) lands; they are the
            # cross-repo contract with that issue — renaming one needs both
            # sides. Claws
            # forwards pod env into k8s-pod agent pods, which is why
            # apps/garage/networkpolicy.yaml admits claws-sessions on 3900.
            # optional: true for the same reason as BROWSER_TOKEN: this
            # Kustomization depends only on claws-prepull, and
            # pages-s3-credentials is minted by migration 0042.
            - name: CLAWS_PAGES_S3_ENDPOINT
              value: http://garage.default.svc.cluster.local:3900
            - name: CLAWS_PAGES_S3_REGION
              value: garage
            - name: CLAWS_PAGES_S3_BUCKET
              value: pages
            - name: CLAWS_PAGES_BASE_URL
              value: https://pages.home.bstjohn.net
            - name: CLAWS_PAGES_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pages-s3-credentials
                  key: access-key-id
                  optional: true
            - name: CLAWS_PAGES_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pages-s3-credentials
                  key: secret-access-key
                  optional: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          # No CPU limit: a throttled claude worker process stalls agent runs.
          # The memory limit is a burst backstop, not a target: with one worker
          # the pod peaked at 3.07 GiB (cgroup memory.peak over 31h, 0 OOM
          # kills) against a ~1.0 GiB idle baseline. 10 GiB is sized for the
          # worst case the watchdogs allow, not that observed case -- see
          # CLAWS_MAX_WORK_WORKERS above, which must move with it. A kubelet
          # OOM here kills the whole pod, taking the dashboard and every
          # headless worker with it and skipping the 420s graceful drain, so
          # the limit is deliberately unreachable rather than snug.
          # Node capacity at the time of the raise (#1460): k3s was using
          # 13.4 GiB of 24 GiB, leaving ~11 GiB genuinely free. Declared limits
          # on the node are already overcommitted (~211% -> ~225% with this),
          # which is normal for limits, but plex also carries a 6 GiB limit, so
          # a simultaneous burst from both is the tail risk to watch.
          # ephemeral-storage covers the writable overlay (~/.cache, container
          # logs) plus the /tmp, ~/.claude, ~/.local and ~/.local/share
          # emptyDirs below. ~/.npm and the subPath mounts are on the PVC and
          # do not count.
          # Exceeding it is an immediate kubelet eviction that skips the 420s
          # terminationGracePeriodSeconds; the StatefulSet recreates the pod
          # afterwards (#1335).
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 8Gi
            limits:
              memory: 10Gi
              ephemeral-storage: 24Gi
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /home/claws/.claws
            # Interactive-session transcripts and the npm cache persisted on
            # the data PVC (#1338) so `--continue` survives an image rollout
            # and worktree `npm ci` stays warm. claude-home/local-home are
            # emptyDirs, not the PVC directly: the image creates ~/.claude and
            # ~/.local only at runtime, so a bare subPath mount there would
            # leave them root-owned and crash-loop container-entrypoint.sh,
            # which rewrites ~/.claude/settings.json and ~/.claude/skills
            # every boot. Nesting the PVC subPath mounts inside these
            # emptyDirs keeps that per-boot rebuild (and so credential
            # ephemerality) untouched. No Codex mount: Claws already gives
            # every interactive Codex session its own CODEX_HOME under
            # ~/.claws/session-mcp/<sessionId>/codex-home, which is already on
            # the PVC via the mount above. local-share is its own emptyDir
            # rather than a directory inside local-home: a runtime-created
            # mount-point ancestor is root-owned 0755, so uid 1000 could not
            # create siblings of opencode/ such as ~/.local/share/pnpm.
            - name: claude-home
              mountPath: /home/claws/.claude
            - name: local-home
              mountPath: /home/claws/.local
            - name: local-share
              mountPath: /home/claws/.local/share
            - name: data
              subPath: state/claude-projects
              mountPath: /home/claws/.claude/projects
            - name: data
              subPath: state/opencode
              mountPath: /home/claws/.local/share/opencode
            - name: data
              subPath: cache/npm
              mountPath: /home/claws/.npm
            - name: tmp
              mountPath: /tmp
            - name: github-app-key
              mountPath: /etc/claws/github-app
              readOnly: true
            - name: github-app-key-stjohnb
              mountPath: /etc/claws/github-app-stjohnb
              readOnly: true
      volumes:
        # Parents for the ~/.claude/projects and ~/.local/share/opencode
        # subPath mounts below; wiped every pod recreation, same as today.
        - name: claude-home
          emptyDir: {}
        - name: local-home
          emptyDir: {}
        - name: local-share
          emptyDir: {}
        # Agent scratch (/tmp/claude-1000, mktemp -d trees, the roots
        # host-disk-monitor sweeps). Wiped on every restart, and counts toward
        # the container's ephemeral-storage limit above (#1335).
        - name: tmp
          emptyDir:
            sizeLimit: 12Gi
        # St-John-Software GitHub App key (id 3408744), SOPS-encrypted in git as
        # apps/claws/github-app.enc.yaml. Projected under the filename claws
        # expects via CLAWS_GITHUB_APP_PRIVATE_KEY_PATH=/etc/claws/github-app/private-key.pem
        # (set in claws-config) — the mount path is load-bearing, do not rename it.
        # 0440 + fsGroup 1000 is readable by uid 1000. Not `optional`: the Secret
        # ships in the `apps` Kustomization, so a missing file means SOPS
        # decryption broke, and ContainerCreating is a louder failure than a
        # runtime ENOENT inside claws. This replaced the hand-seeded, not-in-git
        # Secret `github-app-credentials` (key `privateKey`), which was never
        # declared here so Flux SSA could not wipe it during the cutover.
        - name: github-app-key
          secret:
            secretName: claws-github-app
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
        # Second GitHub App (id 3408918), used for the `stjohnb` owner. Unlike
        # the key above there is NO env var for it: claws reads it only from
        # githubOwnerAppCredentials.stjohnb.privateKeyPath in ~/.claws/config.json
        # on the PVC, which must name /etc/claws/github-app-stjohnb/private-key.pem
        # (see docs/apps-overview.md). Separate Secret and separate directory
        # deliberately: the two Apps rotate independently, and this path is what
        # the k8s-cutover config.json rewrite names.
        - name: github-app-key-stjohnb
          secret:
            secretName: claws-github-app-stjohnb
            optional: true
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
