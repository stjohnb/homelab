---
name: Update claws image

# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: claws-update
  cancel-in-progress: false

# This is the canonical receiver for claws image bumps (#1512):
# St-John-Software/claws' release workflow dispatches it by filename with
# `gh workflow run update-claws.yml`.
#
# sed/git for the tag bump come from this repo's flake.nix `scripts` devShell
# (mkShell's stdenv provides sed and the coreutils) via the job-level default
# shell — the self-hosted NixOS runners provide only nix/git/docker. The
# preflight step runs before checkout, so no flake exists yet: it overrides
# the default shell with plain bash and uses only bash builtins.
jobs:
  update:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#scripts --command bash -euo pipefail {0}
    steps:
      - name: Preflight — require FLEET_INFRA_VERSION_BUMP
        shell: bash
        env:
          TOKEN: ${{ secrets.FLEET_INFRA_VERSION_BUMP }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::FLEET_INFRA_VERSION_BUMP is missing or empty." \
              "Recreate the org-level fine-grained PAT — see docs/infrastructure-overview.md."
            exit 1
          fi

      # PAT checkout (not GITHUB_TOKEN) so the bump branch push and PR are authored
      # by a real user account — GITHUB_TOKEN-authored PRs do not trigger
      # pull_request workflows, so ci.yml would never run on the bump branch and
      # Claws' auto-merger would skip the PR (it requires passing checks).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.FLEET_INFRA_VERSION_BUMP }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Validate tag
        env:
          NEW_TAG: ${{ inputs.tag }}
        run: |
          [[ "${NEW_TAG}" =~ ^v[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]] \
            || { echo "Invalid tag format: ${NEW_TAG}"; exit 1; }

      # Two files, rewritten together (#1373): the claws StatefulSet and its
      # pre-puller Deployment. Flux only rolls the StatefulSet once the
      # pre-puller is Ready on the same tag, so the two must always move as one —
      # check-image-tag-consistency.sh fails CI if they drift. History: this used
      # to glob apps/claws/*.yaml because claws#2752 renamed the staging manifest;
      # #1373 then moved it to its own Flux Kustomization, and #1427 renamed both
      # directories from claws-staging* to claws*. The guard fails the run if
      # either file stops referencing the image, so a rename or move is noticed
      # instead of silently producing no-op runs forever.
      - name: Update image tag
        id: update-tag
        env:
          NEW_TAG: ${{ inputs.tag }}
        run: |
          FILES=(
            clusters/my-cluster/claws/statefulset.yaml
            clusters/my-cluster/claws-prepull/deployment.yaml
          )
          for f in "${FILES[@]}"; do
            if ! grep -q 'ghcr\.io/st-john-software/claws:' "$f"; then
              echo "::error::${f} does not reference" \
                "ghcr.io/st-john-software/claws — the image reference was renamed, moved or removed." \
                "Update this workflow to match."
              exit 1
            fi
          done
          for f in "${FILES[@]}"; do
            sed -i \
              "s|ghcr.io/st-john-software/claws:[^ ]*|ghcr.io/st-john-software/claws:${NEW_TAG}|g" \
              "$f"
          done
          if git diff --quiet clusters/my-cluster/claws clusters/my-cluster/claws-prepull; then
            echo "Image already at ${NEW_TAG}, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same pattern as prod-infra's bump-app-version.yml: the automation/bump-*
      # branch prefix plus the auto-bump label mark this PR for Claws' auto-merger,
      # which merges it once ci.yml passes. No native GitHub auto-merge — with no
      # required status checks on main, enablePullRequestAutoMerge is rejected
      # ("clean status") whenever GitHub computes mergeability before we call it.
      #
      # Fixed branch, NOT automation/bump-claws-<tag> like garden/bin-scraper:
      # claws cuts a release on every push to main (14 on 2026-09-01 alone), so
      # per-tag branches would stack multiple open PRs off the same main and the
      # second to merge would conflict forever. One branch means
      # create-pull-request force-updates the single open PR to the newest tag.
      - name: Open pull request
        if: steps.update-tag.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.FLEET_INFRA_VERSION_BUMP }}
          branch: automation/bump-claws
          delete-branch: true
          commit-message: "chore(claws): update image to ${{ inputs.tag }}"
          title: "chore(claws): update image to ${{ inputs.tag }}"
          body: |
            Automated image update — new claws release.

            Triggered by @${{ github.event.sender.login }} via run ${{ github.run_id }}.
          labels: dependencies,auto-bump
