apiVersion: v1
kind: Service
metadata:
  name: sonarr
  labels:
    app: sonarr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8989
      targetPort: 8989
      protocol: TCP
    # config-reconciler sidecar metrics, scraped by Prometheus job
    # sonarr-reconciler (docs/monitoring.md).
    - name: metrics
      port: 9101
      targetPort: 9101
      protocol: TCP
  selector:
    app: sonarr
