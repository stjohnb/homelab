apiVersion: v1
kind: Service
metadata:
  name: plex
spec:
  # This Service previously had NO selector and was backed by a hand-written
  # Endpoints object pointing at 192.168.0.140 — the iocage jail on the old
  # TrueNAS box. That jail died with the migration to NixOS, so Plex now runs
  # as a Deployment in-cluster and the Service selects its pod directly.
  #
  # Name and port must not change: truenas-gate's nginx proxies to
  # `plex:32400`, and the ingress routes through that gate so an offline NAS
  # shows the wake page instead of a 502.
  selector:
    app: plex
  ports:
    - protocol: TCP
      port: 32400
      targetPort: 32400
  type: ClusterIP
