---
# Authentik `infra` group members authenticating to the kube-apiserver via the
# `headlamp` OIDC provider get the same read-only view as the readonly-user SA.
# Requires the kube-apiserver `oidc-*` flags on the k3s node — see
# docs/infrastructure-overview.md ("The main `k3s` node's host OS is unmanaged").
# Inert until those flags are present.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-infra-readonly-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: read-only-cluster-viewer
subjects:
  - kind: Group
    name: "oidc:infra"
    apiGroup: rbac.authorization.k8s.io
