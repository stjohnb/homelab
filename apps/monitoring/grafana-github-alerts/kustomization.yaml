apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - shared-secret.enc.yaml
  - service.yaml

# server.py is a verbatim copy of production-infra's
# infrastructure/prod/observability/alert-issue-bridge/server.py; make edits
# there first, then copy them here (see docs/monitoring.md). It lives beside
# this file so it can be unit-tested (test_server.py); the hash suffix rolls
# the pod whenever the script changes.
configMapGenerator:
  - name: grafana-github-alerts-script
    namespace: default
    files:
      - server.py

generatorOptions:
  disableNameSuffixHash: false
