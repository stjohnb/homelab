apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: tofu-controller
      # Exact pin, not a range: a controller bump changes what writes to the
      # network, so it must arrive as a reviewable Renovate diff.
      version: "0.16.5"
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
        namespace: flux-system
      interval: 12h
  targetNamespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    runner:
      # The Terraform CR lives in flux-system; the chart only provisions the
      # tf-runner ServiceAccount/RBAC in these namespaces.
      allowedNamespaces:
        - flux-system
