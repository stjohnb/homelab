# Prerequisites:
#   Create the authentik-secrets secret before deploying (with only the admin password):
#
#   kubectl create secret generic authentik-secrets \
#     --from-literal=AUTHENTIK_BOOTSTRAP_PASSWORD="<chosen-admin-password>"
#
#   All other keys are auto-generated by the secret-migrations Jobs in apps/secret-migrations/.
#   The migrations run idempotently on each deploy (Jobs are recreated after TTL cleanup),
#   check for key presence, and skip if already set.
#
#   Note: On a fresh cluster, authentik pods may briefly enter CreateContainerConfigError
#   while waiting for migration Jobs to populate authentik-secrets. This is self-healing —
#   pods retry with backoff and start successfully once the Jobs complete.
#
#   Required keys (managed by secret-migrations, auto-generated on first deploy):
#     AUTHENTIK_SECRET_KEY       - Internal signing/encryption key (0001)
#     AUTHENTIK_BOOTSTRAP_TOKEN  - API token for bootstrap automation (0002)
#     PG_PASS                    - PostgreSQL password (0003)
#     MEALIE_OIDC_CLIENT_SECRET  - OIDC client secret for Mealie SSO (0004)
#     HOME_ASSISTANT_OIDC_CLIENT_SECRET - OIDC client secret for Home Assistant SSO (0022)
#     EXT_OUTPOST_TOKEN          - API token key for the ext proxy outpost (0004)
#
#   Manually provided (operator must choose):
#     AUTHENTIK_BOOTSTRAP_PASSWORD - Initial akadmin user password
#
#   Note: OIDC client secrets are shared via authentik-secrets rather than per-app secrets.
#   The Authentik worker needs them via !Env in blueprints, so they must live here regardless.
#   Duplicating into separate secrets would add operational overhead without isolation benefit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment-server.yaml
  - deployment-worker.yaml
  - service-server.yaml
  - service-worker.yaml
  - ingress.yaml
  - middleware-strip-headers.yaml
  - middleware-forwardauth.yaml
  - middleware-chain.yaml
  - deployment-proxy-ext.yaml
  - service-proxy-ext.yaml
  - middleware-forwardauth-ext.yaml
  - middleware-chain-ext.yaml
  - configmap-blueprints.yaml
  - pdb-server.yaml
