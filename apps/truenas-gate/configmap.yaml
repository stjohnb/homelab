apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-gate-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NAS Offline</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
            }
            .container { text-align: center; padding: 2rem; max-width: 420px; }
            .icon { font-size: 4rem; margin-bottom: 1.5rem; }
            h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
            .subtitle { color: #8892b0; margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5; }
            .wake-btn {
                background: #0d6efd;
                color: #fff;
                border: none;
                padding: 0.875rem 2rem;
                font-size: 1rem;
                font-weight: 500;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.2s;
            }
            .wake-btn:hover { background: #0b5ed7; transform: translateY(-1px); }
            .wake-btn:disabled { background: #6c757d; cursor: not-allowed; transform: none; }
            .status { margin-top: 1.5rem; font-size: 0.875rem; color: #8892b0; min-height: 1.5rem; }
            .status.success { color: #20c997; }
            .status.error { color: #dc3545; }
            .spinner {
                display: inline-block;
                width: 1rem;
                height: 1rem;
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 50%;
                border-top-color: #fff;
                animation: spin 1s linear infinite;
                vertical-align: middle;
                margin-right: 0.5rem;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
            .progress {
                margin-top: 1rem;
                height: 4px;
                background: rgba(255,255,255,0.1);
                border-radius: 2px;
                overflow: hidden;
                display: none;
            }
            .progress.active { display: block; }
            .progress-inner {
                height: 100%;
                background: #0d6efd;
                width: 0%;
                transition: width 1s linear;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">💤</div>
            <h1>The NAS is asleep</h1>
            <p class="subtitle">
                Storage server is powered off to save energy.<br>
                Wake it up to access your media and photos.
            </p>
            <button class="wake-btn" id="wakeBtn" onclick="wake()">
                Wake the NAS
            </button>
            <div class="progress" id="progress">
                <div class="progress-inner" id="progressInner"></div>
            </div>
            <p class="status" id="status"></p>
        </div>

        <script>
            // Same-origin proxy; nginx forwards this to the Home Assistant
            // webhook whose URL lives in a SOPS-encrypted Secret.
            const WAKE_ENDPOINT = '/_gate/wake';
            // Same-origin probe; on the wake host nginx proxies this to
            // immich:2283, which is pinned to the NAS node and so answers
            // 200 only while the NAS is awake.
            const NAS_PROBE_ENDPOINT = '/_gate/nas';

            // Hosts where this page is served as the @gate error page for a
            // real upstream. There, "I can fetch my own origin" genuinely
            // means the backend came back, so reload-on-200 is correct.
            // Everywhere else (wake.home.bstjohn.net, direct pod access) the
            // origin IS this page and always returns 200 — reloading there is
            // an infinite loop that cancels the wake POST (#988).
            const GATED_HOSTS = [
                'immich.home.bstjohn.net',
                'plex.home.bstjohn.net',
                'transmission.home.bstjohn.net',
                'immich.ext.bstjohn.net',
                'plex.ext.bstjohn.net',
                'transmission.ext.bstjohn.net'
            ];
            const IS_GATED_HOST = GATED_HOSTS.indexOf(location.hostname) !== -1;
            const MAX_WAIT = IS_GATED_HOST ? 90 : 150;

            let pollCount = 0;

            async function wake() {
                const btn = document.getElementById('wakeBtn');
                const status = document.getElementById('status');
                const progress = document.getElementById('progress');

                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span>Sending...';
                status.textContent = '';
                status.className = 'status';

                try {
                    const res = await fetch(WAKE_ENDPOINT, { method: 'POST' });
                    if (!res.ok) {
                        throw new Error('wake proxy returned ' + res.status);
                    }

                    btn.innerHTML = '<span class="spinner"></span>Waiting...';
                    status.textContent = 'Wake signal sent. Usually takes 30-60 seconds.';
                    status.className = 'status success';
                    progress.classList.add('active');

                    pollCount = 0;
                    poll();
                } catch (err) {
                    btn.textContent = 'Wake the NAS';
                    btn.disabled = false;
                    status.textContent = 'Failed to send wake signal';
                    status.className = 'status error';
                }
            }

            async function poll() {
                const status = document.getElementById('status');
                const btn = document.getElementById('wakeBtn');

                if (pollCount >= MAX_WAIT) {
                    status.textContent = 'Taking longer than expected. Try refreshing.';
                    status.className = 'status error';
                    btn.textContent = 'Wake the NAS';
                    btn.disabled = false;
                    document.getElementById('progress').classList.remove('active');
                    return;
                }

                pollCount++;
                document.getElementById('progressInner').style.width = (pollCount / MAX_WAIT * 100) + '%';

                try {
                    const up = await probe();
                    if (up) {
                        document.getElementById('progress').classList.remove('active');
                        status.className = 'status success';
                        if (IS_GATED_HOST) {
                            status.textContent = 'Service is back! Redirecting...';
                            setTimeout(() => location.reload(), 1500);
                        } else {
                            status.textContent = 'The NAS is awake.';
                            btn.textContent = 'Wake the NAS';
                            btn.disabled = false;
                        }
                        return;
                    }
                } catch (e) {}

                setTimeout(poll, 1000);
            }

            // Gated hosts probe their own origin (which is the real upstream).
            // The wake host probes /_gate/nas, which nginx proxies to Immich.
            function probe() {
                const url = IS_GATED_HOST ? location.origin : NAS_PROBE_ENDPOINT;
                const timeoutMs = IS_GATED_HOST ? 3000 : 5000;
                return new Promise((resolve) => {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), timeoutMs);

                    fetch(url, { signal: controller.signal, cache: 'no-store' })
                        .then(res => { clearTimeout(timeout); resolve(res.ok); })
                        .catch(() => { clearTimeout(timeout); resolve(false); });
                });
            }

            probe().then(up => {
                if (!up) return;
                if (IS_GATED_HOST) {
                    // Backend recovered before the user clicked — go to it.
                    location.reload();
                    return;
                }
                // Never reload the wake host: it always serves 200.
                const status = document.getElementById('status');
                status.textContent = 'The NAS is currently awake.';
                status.className = 'status success';
            });
        </script>
    </body>
    </html>
