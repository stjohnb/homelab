apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-beefy-config
  labels:
    app: forgejo-runner-beefy
data:
  config.yml: |
    log:
      level: info
      job_level: info

    runner:
      # Connection (url/uuid/token) comes from daemon CLI flags fed by the
      # imperatively-created forgejo-runner-secret. See docs/forgejo-actions.md.
      file: /data/.runner
      capacity: 2
      timeout: 1h
      shutdown_timeout: 10m
      insecure: false
      fetch_timeout: 30s
      fetch_interval: 5s
      report_interval: 1s
      # Forgejo schedules a job here only if EVERY label in the workflow's
      # runs-on list appears below; the first matching label picks the image.
      # All five map to the same image so behaviour never depends on the order
      # of a workflow's runs-on list. The image is built from
      # images/forgejo-runner-nix/ in this repo — node 22 + git + bash + nix.
      # nix is required because ported perudo workflows run every step through
      # `nix develop`; node is required because act_runner supplies none for JS
      # actions like actions/checkout. The image lives on the LAN registry
      # (docs/registry.md), which is also private, so the runner still
      # authenticates via DOCKER_CONFIG (see deployment.yaml) — only the
      # credential and the host changed. Pin an immutable tag here, never
      # :latest. Bumping it requires a runner pod restart — act_runner reads
      # this file only at daemon start.
      # beefy is declared only by the ryzen and k3s-nas runners, so
      # runs-on: [self-hosted, linux, beefy] can never land on the small k3s
      # box; both beefy nodes are frequently powered off, so a beefy job may
      # queue indefinitely — no workflow should use it until that changes.
      labels:
        - "self-hosted:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "linux:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "docker:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "ubuntu-latest:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "ubuntu-22.04:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"
        - "beefy:docker://registry.home.bstjohn.net/st-john-software/forgejo-runner-nix:20260827-1333-c982390"

    cache:
      # Disabled: the cache proxy binds in the pod netns and is not reliably
      # reachable from job containers created by the dind sidecar. No migrated
      # workflow uses actions/cache yet.
      enabled: false

    container:
      network: ""
      privileged: false
      options:
      workdir_parent:
      valid_volumes: []
      # "-" = do not mount a docker socket into job containers. The runner
      # still locates the dind daemon through the DOCKER_HOST env var.
      docker_host: "-"
      force_pull: false
      force_rebuild: false

    host:
      workdir_parent:
