apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  targetNamespace: traefik
  # Helm never upgrades files in a chart's crds/ directory, and Flux defaults
  # upgrade.crds to Skip. CreateReplace keeps the traefik.io CRDs (Middleware,
  # IngressRoute, TLSOption, ...) in step with the Traefik binary the chart ships.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    providers:
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
    service:
      spec:
        type: LoadBalancer
        loadBalancerIP: 192.168.0.251
    ports:
      # forwardedHeaders: keep insecure=false and trustedIPs empty. Traefik's
      # entrypoint XForwarded handler deletes every client-supplied X-Forwarded-*
      # header before routing; the Authentik ForwardAuth middleware
      # (apps/authentik/middleware-forwardauth.yaml) and Grafana's auth.proxy both
      # depend on that. Setting either would let clients forge X-Forwarded-Host and
      # choose which Authentik application's policies get evaluated.
      web:
        port: 80
        exposedPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
        forwardedHeaders:
          trustedIPs: []
          insecure: false
      websecure:
        port: 443
        exposedPort: 443
        http:
          tls:
            enabled: true
        forwardedHeaders:
          trustedIPs: []
          insecure: false
        # Blob pushes stream layers of several hundred MB in one request;
        # Traefik v3's 60s default readTimeout covers the whole request body.
        transport:
          respondingTimeouts:
            readTimeout: 600s
    accessLog:
      enabled: true
      format: json
      fields:
        defaultMode: keep
        headers:
          defaultMode: drop
          names:
            User-Agent: keep
            Content-Type: keep
            X-Forwarded-For: keep
            X-Real-Ip: keep
            Host: keep
            Accept: keep
            Referer: keep
            Authorization: redact
            Cookie: redact
            Set-Cookie: redact
    ingressClass:
      enabled: true
      isDefaultClass: true
